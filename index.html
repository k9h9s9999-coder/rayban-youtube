<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ray-Ban YouTube V13 - Proper D-PAD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:2px solid #00ff88}
.hud.big-mode{border-radius:0;border:0}
.hud.big-mode .header, .hud.big-mode .search-row, .hud.big-mode .status, .hud.big-mode .info-box, .hud.big-mode .footer, .hud.big-mode .keypad-wrap, .hud.big-mode .hint{display:none !important}
.header{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row{display:flex;gap:4px;padding:6px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#0a0a0a;border:1px solid #333;border-radius:10px;padding:8px;color:#fff;font-size:16px;outline:none}
.search-row button{background:#fff;color:#000;border:0;border-radius:10px;padding:0 10px;font-weight:900;font-size:12px;min-width:46px;height:36px}
.search-row button.kb{background:#1e1e1e;color:#00ff88;border:1px solid #333;min-width:40px}
.search-row button.voice{background:#1e1e1e;color:#ff3b30;border:1px solid #333;min-width:40px}
.status{height:20px;padding:0 10px;font-size:9px;color:#00ff88;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#121212}
.list{flex:1;overflow:hidden;padding:6px;display:flex;flex-direction:column;gap:6px}
.card-btn{
  display:flex;gap:8px;align-items:center;
  background:#1e1e1e;border:2px solid transparent;border-radius:12px;padding:8px;
  width:100%;text-align:left;cursor:pointer;min-height:82px;
  transition:all .12s;outline:none;color:#fff;
}
.card-btn:focus{
  border-color:#00ff88;background:#2a2a2a;transform:scale(1.02);
  box-shadow:0 0 0 3px rgba(0,255,136,.3);
}
.card-btn:focus .num{background:#00ff88;color:#000}
.thumb{width:108px;height:60px;border-radius:8px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:10px;color:#aaa;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{background:#2a2a2a;color:#00ff88;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}
.player{flex:1;display:flex;flex-direction:column;background:#000}
.player iframe{flex:1;width:100%;border:0}
.controls{display:flex;gap:6px;padding:6px;background:#1a1a1a;flex-shrink:0}
.ctrl{flex:1;background:#2a2a2a;border:0;color:#fff;padding:12px 4px;border-radius:10px;font-size:12px;font-weight:800}
.ctrl.big{flex:1.3;background:#fff;color:#000}
.ctrl.exit{background:#ff3b30;color:#fff}
.keypad-wrap{display:none;flex-direction:column;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0;max-height:200px;overflow-y:auto}
.keypad-tabs{display:flex;gap:4px;padding:4px}
.keypad-tabs button{flex:1;padding:6px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#888;font-size:10px;font-weight:800}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad{display:grid;gap:3px;padding:6px}
.keypad.kr{grid-template-columns:repeat(10,1fr)}
.keypad.en{grid-template-columns:repeat(10,1fr)}
.keypad button{background:#1e1e1e;border:0;color:#fff;padding:8px 2px;border-radius:8px;font-size:13px;font-weight:700;min-height:36px}
.footer{height:14px;padding:0 8px;background:#000;display:flex;justify-content:space-between;align-items:center;font-size:8px;color:#555;flex-shrink:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#777;padding:20px;text-align:center}
.info-box{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:5px 8px;font-size:8px;color:#888;margin:3px 6px}
.hint{background:#00ff88;color:#000;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:800;margin:3px 6px;text-align:center}
</style>
</head>
<body>
<div class="hud" id="hud">
  <div class="header">
    <div>RB YouTube <span style="font-size:8px;background:#00ff88;color:#000;padding:1px 4px;border-radius:3px;font-weight:800">V13 D-PAD FOCUSABLE</span></div>
    <div style="font-size:8px;color:#00ff88" id="pageInfo"></div>
  </div>
  <div class="search-row">
    <input id="q" placeholder="검색어" value="" readonly>
    <button id="voiceBtn" class="voice" onclick="startVoice()">🎤</button>
    <button id="kbBtn" class="kb" onclick="toggleKeypad()">⌨️</button>
    <button id="searchBtn" tabindex="0" onclick="doSearch()">검색</button>
  </div>
  <div class="status"><span id="statusText">V13: 포커스 가능한 버튼으로 변경</span><span id="info">ready</span></div>
  <div class="hint">👆 안경: Neural Band 위/아래 스와이프 = 포커스 이동 / 핀치 = Enter(재생) / 뒤로 쓸기 = Escape</div>
  <div class="content" id="content">
    <div id="list" class="list"></div>
    <div id="player" class="player" style="display:none"></div>
  </div>
  <div id="keypadWrap" class="keypad-wrap">
    <div class="keypad-tabs">
      <button id="tabKr" class="active" onclick="setLang('kr')">한글</button>
      <button id="tabEn" onclick="setLang('en')">ENG</button>
      <button onclick="clearInput()">지우기</button>
      <button onclick="hideKeypad()" style="background:#333;color:#fff">▼ 닫기</button>
    </div>
    <div id="keypad" class="keypad kr"></div>
  </div>
  <div class="footer"><span>V13 • BUTTON FOCUSABLE • D-PAD ONLY • NO SCROLL</span><span id="count">0개</span></div>
</div>

<script>
// 한글 조합 (간단 버전 유지)
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choIdx(c){return CHO.indexOf(c);} function jungIdx(j){return JUNG.indexOf(j);} function jongIdx(j){return JONG.indexOf(j);}
function makeSyllable(cho,jung,jong){if(cho<0||jung<0) return null; return String.fromCharCode(0xAC00+cho*21*28+jung*28+jong);}
let committed=''; let composing={cho:-1,jung:-1,jong:0};
function getComposingChar(){if(composing.cho>=0&&composing.jung>=0){return makeSyllable(composing.cho,composing.jung,composing.jong);} if(composing.cho>=0&&composing.jung<0){return CHO[composing.cho];} if(composing.cho<0&&composing.jung>=0){return JUNG[composing.jung];} return '';}
function commitComposing(){const ch=getComposingChar(); if(ch) committed+=ch; composing={cho:-1,jung:-1,jong:0};}
function updateInputField(){document.getElementById('q').value=committed+getComposingChar();}
function isConsonant(j){return CHO.includes(j);}
function inputHangulClean(jamo){
  if(jamo===' '){commitComposing(); committed+=' '; updateInputField(); return;}
  const DOUBLE_CHO_COMBINE = {'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'};
  const DOUBLE_JUNG_COMBINE = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
  const DOUBLE_JONG_COMBINE = {'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
  const DOUBLE_JONG_SPLIT = {'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  if(isConsonant(jamo)){
    const cIdx=choIdx(jamo);
    if(composing.cho<0&&composing.jung<0){composing.cho=cIdx;}
    else if(composing.cho>=0&&composing.jung<0){const prev=CHO[composing.cho]; const comb=DOUBLE_CHO_COMBINE[prev+jamo]; if(comb){composing.cho=choIdx(comb);} else {committed+=CHO[composing.cho]; composing.cho=cIdx;}}
    else if(composing.jung>=0&&composing.jong==0){const ji=jongIdx(jamo); if(ji>0){composing.jong=ji;} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
    else if(composing.jong>0){const prevJ=JONG[composing.jong]; const comb=DOUBLE_JONG_COMBINE[prevJ+jamo]; if(comb){composing.jong=jongIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,composing.jong); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
  } else {
    const vIdx=jungIdx(jamo);
    if(composing.cho<0){composing.cho=choIdx('ㅇ'); composing.jung=vIdx;}
    else if(composing.jung<0){composing.jung=vIdx;}
    else if(composing.jong==0){const prevV=JUNG[composing.jung]; const comb=DOUBLE_JUNG_COMBINE[prevV+jamo]; if(comb){composing.jung=jungIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:choIdx('ㅇ'),jung:vIdx,jong:0};}}
    else {const jongChar=JONG[composing.jong]; let remainingJong=0; let nextChoChar=jongChar; if(DOUBLE_JONG_SPLIT[jongChar]){const parts=DOUBLE_JONG_SPLIT[jongChar]; remainingJong=jongIdx(parts[0]); nextChoChar=parts[1];} else {remainingJong=0; nextChoChar=jongChar;} const syl=makeSyllable(composing.cho,composing.jung,remainingJong); committed+=syl; composing={cho:choIdx(nextChoChar),jung:vIdx,jong:0};}
  }
  updateInputField();
}
function delKey(){
  const DOUBLE_JONG_SPLIT = {'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  const DOUBLE_JUNG_COMBINE = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
  const DOUBLE_CHO_COMBINE = {'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'};
  if(getComposingChar()){
    if(composing.jong>0){const jc=JONG[composing.jong]; if(DOUBLE_JONG_SPLIT[jc]){const first=DOUBLE_JONG_SPLIT[jc][0]; composing.jong=jongIdx(first);} else {composing.jong=0;}}
    else if(composing.jung>=0){const jChar=JUNG[composing.jung]; let found=false; for(const [k,v] of Object.entries(DOUBLE_JUNG_COMBINE)){if(v===jChar){composing.jung=jungIdx(k[0]); found=true; break;}} if(!found) composing.jung=-1;}
    else if(composing.cho>=0){const cChar=CHO[composing.cho]; let found=false; for(const [k,v] of Object.entries(DOUBLE_CHO_COMBINE)){if(v===cChar){composing.cho=choIdx(k[0]); found=true; break;}} if(!found) composing.cho=-1;}
  } else {if(committed.length>0) committed=committed.slice(0,-1);} updateInputField();
}
function clearInput(){committed=''; composing={cho:-1,jung:-1,jong:0}; updateInputField();}
function typeKey(k){if(currentLang==='kr'){if(k===' ') inputHangulClean(' '); else inputHangulClean(k);} else {commitComposing(); committed+=k; updateInputField();}}
let currentLang='kr';
function setLang(lang){currentLang=lang; document.getElementById('tabKr').classList.toggle('active',lang==='kr'); document.getElementById('tabEn').classList.toggle('active',lang==='en'); buildKeypad();}
function buildKeypad(){
  const kp=document.getElementById('keypad'); kp.innerHTML=''; kp.className='keypad '+currentLang;
  if(currentLang==='kr'){
    const rows=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']];
    rows.forEach(row=>{row.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.onclick=()=>typeKey(k); kp.appendChild(b);});});
    const space=document.createElement('button'); space.textContent='스페이스'; space.style.gridColumn='span 4'; space.onclick=()=>typeKey(' '); kp.appendChild(space);
    const del=document.createElement('button'); del.textContent='⌫'; del.style.background='#ff3b30'; del.style.color='#fff'; del.style.gridColumn='span 2'; del.onclick=()=>delKey(); kp.appendChild(del);
    const enter=document.createElement('button'); enter.textContent='검색'; enter.style.background='#00ff88'; enter.style.color='#000'; enter.style.gridColumn='span 4'; enter.onclick=()=>doSearch(); kp.appendChild(enter);
  } else {
    const rows=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];
    rows.forEach(row=>{row.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.onclick=()=>typeKey(k); kp.appendChild(b);});});
    const space=document.createElement('button'); space.textContent='Space'; space.style.gridColumn='span 4'; space.onclick=()=>typeKey(' '); kp.appendChild(space);
    const del=document.createElement('button'); del.textContent='⌫'; del.style.background='#ff3b30'; del.style.color='#fff'; del.style.gridColumn='span 2'; del.onclick=()=>delKey(); kp.appendChild(del);
    const enter=document.createElement('button'); enter.textContent='Search'; enter.style.background='#00ff88'; enter.style.color='#000'; enter.style.gridColumn='span 4'; enter.onclick=()=>doSearch(); kp.appendChild(enter);
  }
}
function showKeypad(){document.getElementById('keypadWrap').style.display='flex';}
function hideKeypad(){document.getElementById('keypadWrap').style.display='none';}
function toggleKeypad(){const w=document.getElementById('keypadWrap'); if(w.style.display==='none'||w.style.display===''){showKeypad();} else {hideKeypad();}}

let lastItems=[], focusedIndex=0, currentPage=0, isPlayer=false, isBigMode=false;
const ITEMS_PER_PAGE = 5;

async function fetchTimeout(url,ms=6500){const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); try{const r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) throw new Error(r.status); return await r.json();}catch(e){clearTimeout(t); throw e;}}
async function searchPiped(q){const INSTANCES=["https://pipedapi.kavin.rocks","https://api.piped.private.coffee","https://pipedapi.adminforge.de"]; for(let i=0;i<INSTANCES.length;i++){document.getElementById('info').textContent=`${i+1}/${INSTANCES.length}`; try{const d=await fetchTimeout(`${INSTANCES[i]}/search?q=${encodeURIComponent(q)}&filter=videos`,7000); if(d.items&&d.items.length) return {items:d.items, host:new URL(INSTANCES[i]).host};}catch(e){continue;}} throw new Error('all failed');}

function renderPage(){
  const list=document.getElementById('list');
  list.innerHTML='';
  document.getElementById('player').style.display='none';
  list.style.display='flex';
  isPlayer=false; isBigMode=false;
  document.getElementById('hud').classList.remove('big-mode');
  
  const start = currentPage * ITEMS_PER_PAGE;
  const end = Math.min(start + ITEMS_PER_PAGE, lastItems.length);
  
  for(let idx=start; idx<end; idx++){
    const v=lastItems[idx];
    const id=v.url?.replace('/watch?v=','')||v.id||'';
    const title=v.title||'No title';
    const ch=v.uploaderName||v.author||'';
    const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
    const btn=document.createElement('button');
    btn.className='card-btn';
    btn.id='card-'+idx;
    btn.setAttribute('tabindex','0');
    btn.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" loading="lazy"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
    btn.addEventListener('click', ()=>{ focusedIndex=idx; playVideo(id,title,idx); });
    btn.addEventListener('focus', ()=>{ focusedIndex=idx; document.getElementById('statusText').textContent=`${idx+1}/${lastItems.length} 포커스 - Enter로 재생`; });
    list.appendChild(btn);
  }
  
  document.getElementById('pageInfo').textContent=`${currentPage+1}/${Math.ceil(lastItems.length/ITEMS_PER_PAGE)}`;
  document.getElementById('count').textContent=lastItems.length+'개';
  // 첫 번째 버튼에 포커스
  setTimeout(()=>{
    const first=document.getElementById('card-'+start);
    if(first) first.focus();
  },100);
}

function playVideo(id,title,idx){
  const list=document.getElementById('list'); list.style.display='none';
  hideKeypad();
  const player=document.getElementById('player'); player.style.display='flex'; isPlayer=true;
  player.innerHTML=`
    <div class="controls">
      <button class="ctrl" tabindex="0" onclick="backToList()">← 목록 (Esc)</button>
      <button class="ctrl big" tabindex="0" onclick="toggleBigMode()">⛶ 크게</button>
      <button class="ctrl" tabindex="0" onclick="nextVideo(1)">다음 →</button>
    </div>
    <iframe id="yt" src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <div class="controls">
      <button class="ctrl" tabindex="0" onclick="nextVideo(-1)">← 이전</button>
      <button class="ctrl big" tabindex="0" onclick="backToList()">✕ 닫기</button>
      <button class="ctrl exit" tabindex="0" onclick="toggleBigMode()">⛶ 크게/작게</button>
    </div>`;
  setTimeout(()=>{
    const backBtn=player.querySelector('button');
    if(backBtn) backBtn.focus();
  },100);
}
function backToList(){document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex'; isPlayer=false; isBigMode=false; document.getElementById('hud').classList.remove('big-mode'); renderPage();}
function nextVideo(dir){if(!lastItems.length) return; let ni=focusedIndex+dir; if(ni<0) ni=lastItems.length-1; if(ni>=lastItems.length) ni=0; focusedIndex=ni; currentPage=Math.floor(focusedIndex/ITEMS_PER_PAGE); const v=lastItems[ni]; const id=v.url?.replace('/watch?v=','')||v.id; playVideo(id,v.title,ni);}
function toggleBigMode(){
  const hud=document.getElementById('hud');
  isBigMode=!isBigMode;
  if(isBigMode){ hud.classList.add('big-mode'); document.getElementById('statusText').textContent='큰 화면 - Esc로 나가기'; }
  else { hud.classList.remove('big-mode'); }
}
function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('statusText').textContent='안경: 마이크 차단됨 - Hey Meta, search cats 라고 말해보세요';
    return;
  }
  const recog=new SpeechRecognition(); recog.lang='ko-KR';
  document.getElementById('statusText').textContent='듣는 중...';
  recog.onresult=(e)=>{ const text=e.results[0][0].transcript; committed=text; composing={cho:-1,jung:-1,jong:0}; updateInputField(); doSearch(); };
  recog.onerror=(e)=>{ document.getElementById('statusText').textContent='음성 실패: '+e.error; };
  recog.start();
}

// 핵심: D-PAD 네비게이션은 브라우저가 알아서 함. 우리는 preventDefault 하지 않음. 포커스 이동만 추적
document.addEventListener('keydown', e=>{
  // console.log('keydown', e.key);
  if(e.key==='Escape'){
    if(isBigMode){ toggleBigMode(); return; }
    if(isPlayer){ backToList(); return; }
    if(document.getElementById('keypadWrap').style.display!=='none'){ hideKeypad(); return; }
  }
  // Arrow 키는 브라우저 공간 네비게이션이 처리하도록 preventDefault 안 함!
  // Enter는 버튼의 기본 클릭으로 처리됨
});

async function doSearch(){
  commitComposing();
  const q=document.getElementById('q').value.trim()||'고양이';
  hideKeypad();
  document.getElementById('statusText').textContent='검색 중...';
  document.getElementById('list').innerHTML='<div class="center"><b>검색 중...</b></div>';
  document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex';
  try{
    const res=await searchPiped(q);
    lastItems=res.items.slice(0,20);
    focusedIndex=0; currentPage=0;
    document.getElementById('info').textContent=res.host+' ✓';
    renderPage();
  }catch(e){
    document.getElementById('list').innerHTML=`<div class="center"><b>검색 실패</b><button tabindex="0" onclick="doSearch()" style="background:#00ff88;color:#000;border:0;padding:10px 20px;border-radius:10px;font-weight:900">재시도</button></div>`;
  }
}

buildKeypad(); hideKeypad();
setTimeout(()=>{ document.getElementById('q').value='고양이'; doSearch(); }, 600);
</script>
</body>
</html>
