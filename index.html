<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V44 Herald Style Playback</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:3px solid #00ff88;transition:border 0.3s, border-radius 0.3s}
.hud.playing{border:none !important;border-radius:0 !important;background:#000}
.hud.playing .header, .hud.playing .search-row, .hud.playing .status, .hud.playing .footer, .hud.playing .pagination, .hud.playing .keypad-wrap, .hud.playing .version{display:none !important}
.hud.playing .content{flex:1;height:600px;background:#000;border:none}
.hud.playing .player{height:600px;width:600px;background:#000;display:flex !important;position:relative;border:none;border-radius:0}
.hud.playing .player iframe{height:600px !important;width:600px !important;border:0;border-radius:0}
.header{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;font-size:12px}
.search-row{display:flex;gap:6px;padding:8px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#111;border:3px solid #00ff88;border-radius:12px;padding:14px 12px;color:#fff;font-size:18px;outline:none}
.search-row input:focus{box-shadow:0 0 0 4px rgba(0,255,136,.6);background:#222}
.search-row button{background:#00ff88;color:#000;border:0;border-radius:12px;padding:0 14px;font-weight:900;font-size:15px;min-width:70px;height:50px;outline:none}
.search-row button:focus{box-shadow:0 0 0 4px #fff;transform:scale(1.05)}
.search-row button.kb{background:#222;color:#00ff88;border:3px solid #00ff88;min-width:90px}
.status{height:22px;padding:0 10px;font-size:9px;color:#00ff88;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#121212;min-height:0}
.list{flex:1;overflow:hidden;padding:6px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.card-btn{display:flex;gap:8px;align-items:center;background:#1e1e1e;border:3px solid transparent;border-radius:12px;padding:8px;width:100%;text-align:left;min-height:56px;color:#fff;outline:none}
.card-btn:focus{border-color:#00ff88;background:#2a2a2a;box-shadow:0 0 0 4px rgba(0,255,136,.7);transform:scale(1.02)}
.thumb{width:80px;height:44px;border-radius:6px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:11px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:8px;color:#aaa}
.num{background:#2a2a2a;color:#00ff88;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}
.player{flex:1;display:none;background:#000;position:relative;overflow:hidden}
.player iframe{flex:1;width:100%;border:0}
.pagination{height:44px;display:flex;gap:8px;padding:6px;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0}
.page-btn{flex:1;background:#1e1e1e;border:2px solid #333;color:#fff;border-radius:10px;font-size:12px;font-weight:800;height:32px;outline:none}
.page-btn:focus{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 0 3px #fff}
.footer{height:16px;padding:0 8px;background:#000;display:flex;justify-content:space-between;font-size:8px;color:#444;flex-shrink:0;align-items:center}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#666;padding:20px;text-align:center}
.version{position:absolute;top:2px;right:2px;background:#ff0044;color:#fff;font-size:12px;font-weight:900;padding:4px 8px;border-radius:6px;z-index:99}
.keypad-wrap{display:flex;flex-direction:column;background:#000;border-top:4px solid #00ff88;flex-shrink:0;height:320px;overflow:hidden}
.keypad-wrap.hidden{display:none !important}
.keypad-tabs{display:flex;gap:4px;padding:6px;background:#111;flex-shrink:0}
.keypad-tabs button{flex:1;padding:12px;border-radius:8px;border:2px solid #333;background:#1e1e1e;color:#fff;font-size:12px;font-weight:800;min-height:40px;outline:none}
.keypad-tabs button:focus{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 0 3px #fff}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad{display:grid;gap:6px;padding:8px;flex:1;overflow-y:auto;align-content:start;background:#000;grid-template-columns:repeat(10,1fr)}
.keypad button{background:#333;border:2px solid #555;color:#fff;border-radius:10px;font-size:16px;font-weight:700;min-height:50px;outline:none;position:relative}
.keypad button:focus{background:#00ff88 !important;color:#000 !important;border-color:#fff !important;transform:scale(1.15);box-shadow:0 0 0 4px #00ff88;z-index:10}
.keypad button.del{background:#552222;color:#ff7777;border-color:#ff4444}
.keypad button.search{background:#00ff88;color:#000;border-color:#00ff88;font-weight:900;font-size:18px}
.keypad button.space{background:#111;color:#00ff88;border-color:#00ff88;grid-column:span 4}

/* V44 Herald Style Playback - herald.ascents.gg/a/youtube 처럼 */
.herald-playback{position:absolute;top:0;left:0;width:600px;height:600px;z-index:30;display:none;background:#000;flex-direction:column}
.hud.playing .herald-playback{display:flex}
.herald-video{flex:1;width:600px;height:540px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
.herald-video iframe{width:600px;height:540px;border:0;background:#000}
.herald-topbar{height:48px;background:rgba(0,0,0,0.9);display:flex;align-items:center;padding:0 12px;gap:12px;backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.1);flex-shrink:0}
.herald-back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}
.herald-back:active{background:rgba(255,255,255,0.3)}
.herald-title{flex:1;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.herald-bottom{height:60px;background:rgba(0,0,0,0.9);display:flex;align-items:center;padding:0 16px;gap:12px;backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,0.1);flex-shrink:0}
.herald-progress-wrap{flex:1;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden;position:relative}
.herald-progress-fill{height:100%;background:#fff;width:0%;border-radius:2px;transition:width 0.3s}
.herald-time{font-size:10px;color:rgba(255,255,255,0.7);min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.herald-center-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:20px 28px;border-radius:28px;font-size:32px;font-weight:900;display:none;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);z-index:40;pointer-events:none}
.herald-center-hint.show{display:flex;animation:heraldPop 0.3s}
@keyframes heraldPop{0%{transform:translate(-50%,-50%) scale(0.8);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.herald-side-hint{position:absolute;top:50%;background:rgba(0,0,0,0.8);color:#fff;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:700;display:none;align-items:center;gap:8px;backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);z-index:40;pointer-events:none}
.herald-side-hint.show{display:flex;animation:heraldSide 0.3s}
.herald-side-hint.left{left:16px;transform:translateY(-50%)}
.herald-side-hint.right{right:16px;transform:translateY(-50%)}
@keyframes heraldSide{0%{opacity:0;transform:translateY(-50%) scale(0.9)}100%{opacity:1;transform:translateY(-50%) scale(1)}}
.herald-dpad-hint{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:rgba(255,255,255,0.8);padding:6px 12px;border-radius:16px;font-size:9px;display:flex;gap:12px;z-index:35;pointer-events:none;border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div class="hud" id="hud">
<div class="version">V44 Herald 스타일</div>
<div class="header"><div>RB YouTube V44</div><div style="font-size:9px;color:#00ff88" id="pageInfo">V44 Herald</div></div>
<div class="search-row">
<input id="q" type="text" readonly placeholder="여기 누르면 키보드" onclick="showKB()">
<button id="kbBtn" class="kb" onclick="toggleKB()">⌨️ 키보드</button>
<button id="searchBtn" onclick="doSearchHide()">검색</button>
</div>
<div class="status"><span id="statusText">V44: Herald처럼 재생 - Swipe + Dpad</span><span id="info">대기중</span></div>
<div class="content" id="content"><div id="list" class="list"></div><div id="player" class="player">
<div id="playerDiv" style="width:100%;height:100%"></div>
<!-- Herald 스타일 재생 UI -->
<div class="herald-playback" id="heraldPlayback">
<div class="herald-topbar">
<button class="herald-back" onclick="backToList()">‹</button>
<div class="herald-title" id="heraldTitle">YouTube</div>
</div>
<div class="herald-video" id="heraldVideo"></div>
<div class="herald-bottom">
<div class="herald-progress-wrap"><div class="herald-progress-fill" id="heraldProgress"></div></div>
<div class="herald-time" id="heraldTime">0:00 / 0:00</div>
</div>
<div class="herald-center-hint" id="heraldCenterHint">▶️</div>
<div class="herald-side-hint left" id="heraldLeftHint">⏪ -10s</div>
<div class="herald-side-hint right" id="heraldRightHint">+10s ⏩</div>
<div class="herald-dpad-hint"><span>‹ › 탐색</span><span>^ v 볼륨</span><span>탭 재생</span></div>
</div>
</div></div>
<div class="pagination" id="pagination">
<button class="page-btn" id="prevBtn" onclick="changePage(-1)">◀ 이전</button>
<button class="page-btn" id="nextBtn" onclick="changePage(1)">다음 ▶</button>
</div>
<div id="keypadWrap" class="keypad-wrap hidden">
<div class="keypad-tabs">
<button id="tabKr" class="active" onclick="setLang('kr')">한글</button>
<button id="tabEn" onclick="setLang('en')">ENG</button>
<button onclick="clearInput()">지우기</button>
<button onclick="hideKB()">닫기</button>
</div>
<div id="keypad" class="keypad"></div>
</div>
<div class="footer"><span>V44 Herald 재생</span><span id="count">0개</span></div>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
console.log('V44 Herald Style');
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choIdx(c){return CHO.indexOf(c);} function jungIdx(j){return JUNG.indexOf(j);} function jongIdx(j){return JONG.indexOf(j);}
function makeSyllable(cho,jung,jong){if(cho<0||jung<0) return null; return String.fromCharCode(0xAC00+cho*21*28+jung*28+jong);}
let committed=''; let composing={cho:-1,jung:-1,jong:0};
function getComposingChar(){if(composing.cho>=0&&composing.jung>=0){return makeSyllable(composing.cho,composing.jung,composing.jong);} if(composing.cho>=0&&composing.jung<0){return CHO[composing.cho];} if(composing.cho<0&&composing.jung>=0){return JUNG[composing.jung];} return '';}
function commitComposing(){const ch=getComposingChar(); if(ch) committed+=ch; composing={cho:-1,jung:-1,jong:0};}
function updateInput(){const d=committed+getComposingChar(); const el=document.getElementById('q'); if(el) el.value=d; const st=document.getElementById('statusText'); if(st) st.textContent=d?`입력: ${d}`:`V44: Herald처럼 - Dpad + Swipe 재생`;}
function isConsonant(j){return CHO.includes(j);}
function inputHangul(jamo){
  if(jamo===' '){commitComposing(); committed+=' '; updateInput(); return;}
  const DC={'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'}; const DJC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'}; const DJOC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'}; const DJS={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  if(isConsonant(jamo)){
    const cIdx=choIdx(jamo);
    if(composing.cho<0&&composing.jung<0){composing.cho=cIdx;}
    else if(composing.cho>=0&&composing.jung<0){const prev=CHO[composing.cho]; const comb=DC[prev+jamo]; if(comb){composing.cho=choIdx(comb);} else {committed+=CHO[composing.cho]; composing.cho=cIdx;}}
    else if(composing.jung>=0&&composing.jong==0){const ji=jongIdx(jamo); if(ji>0){composing.jong=ji;} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
    else if(composing.jong>0){const prevJ=JONG[composing.jong]; const comb=DJOC[prevJ+jamo]; if(comb){composing.jong=jongIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,composing.jong); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
  } else {
    const vIdx=jungIdx(jamo);
    if(composing.cho<0){composing.cho=choIdx('ㅇ'); composing.jung=vIdx;}
    else if(composing.jung<0){composing.jung=vIdx;}
    else if(composing.jong==0){const prevV=JUNG[composing.jung]; const comb=DJC[prevV+jamo]; if(comb){composing.jung=jungIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:choIdx('ㅇ'),jung:vIdx,jong:0};}}
    else {const jongChar=JONG[composing.jong]; let rem=0; let nextC=jongChar; if(DJS[jongChar]){const p=DJS[jongChar]; rem=jongIdx(p[0]); nextC=p[1];} else {rem=0; nextC=jongChar;} const syl=makeSyllable(composing.cho,composing.jung,rem); committed+=syl; composing={cho:choIdx(nextC),jung:vIdx,jong:0};}
  }
  updateInput();
}
function delKey(){if(getComposingChar()){if(composing.jong>0){composing.jong=0;} else if(composing.jung>=0){composing.jung=-1;} else if(composing.cho>=0){composing.cho=-1;}} else {if(committed.length>0) committed=committed.slice(0,-1);} updateInput();}
function clearInput(){committed=''; composing={cho:-1,jung:-1,jong:0}; updateInput();}
function typeKey(k){if(currentLang==='kr'){if(k===' ') inputHangul(' '); else inputHangul(k);} else {commitComposing(); committed+=k; updateInput();}}
let currentLang='kr';
function setLang(lang){currentLang=lang; const kr=document.getElementById('tabKr'); const en=document.getElementById('tabEn'); if(kr) kr.classList.toggle('active',lang==='kr'); if(en) en.classList.toggle('active',lang==='en'); buildKeypad(); rebuildFocusable();}
function toggleKB(){const w=document.getElementById('keypadWrap'); const btn=document.getElementById('kbBtn'); if(!w) return; if(w.classList.contains('hidden')){w.classList.remove('hidden'); w.style.display='flex'; if(btn){btn.textContent='⌨️ 닫기';} rebuildFocusable(); setTimeout(()=>{moveFocusToFirstKeypad()},100);} else {w.classList.add('hidden'); w.style.display='none'; if(btn){btn.textContent='⌨️ 키보드';} rebuildFocusable();}}
function showKB(){const w=document.getElementById('keypadWrap'); const btn=document.getElementById('kbBtn'); if(!w) return; w.classList.remove('hidden'); w.style.display='flex'; if(btn) btn.textContent='⌨️ 닫기'; rebuildFocusable(); setTimeout(()=>{moveFocusToFirstKeypad()},100);}
function hideKB(){const w=document.getElementById('keypadWrap'); const btn=document.getElementById('kbBtn'); if(!w) return; w.classList.add('hidden'); w.style.display='none'; if(btn) btn.textContent='⌨️ 키보드'; rebuildFocusable();}
let focusableElements=[]; let focusIndex=0; let keypadRows=[]; let keypadRowStarts=[];
function rebuildFocusable(){
  const visible = [];
  const q=document.getElementById('q'); if(q) visible.push(q);
  const kbBtn=document.getElementById('kbBtn'); if(kbBtn) visible.push(kbBtn);
  const searchBtn=document.getElementById('searchBtn'); if(searchBtn) visible.push(searchBtn);
  const keypadWrap=document.getElementById('keypadWrap');
  const isKeypadVisible = keypadWrap && !keypadWrap.classList.contains('hidden');
  if(isKeypadVisible){
    const tabs=document.querySelectorAll('#keypadWrap .keypad-tabs button');
    tabs.forEach(b=>visible.push(b));
    if(currentLang==='kr'){ keypadRows=[10,9,7,3]; } else { keypadRows=[10,8,7,3]; }
    keypadRowStarts=[]; let sum=0; for(let i=0;i<keypadRows.length;i++){ keypadRowStarts.push(sum); sum+=keypadRows[i]; }
    const keys=document.querySelectorAll('#keypad button');
    keys.forEach(b=>visible.push(b));
  } else {
    keypadRows=[]; keypadRowStarts=[];
    const cards=document.querySelectorAll('#list .card-btn');
    cards.forEach(b=>visible.push(b));
    const prev=document.getElementById('prevBtn'); if(prev) visible.push(prev);
    const next=document.getElementById('nextBtn'); if(next) visible.push(next);
  }
  focusableElements=visible;
}
function getKeypadIndexFromFocusable(focusIdx){ const topCount=3; const tabsCount=4; const keypadStart=topCount+tabsCount; return focusIdx-keypadStart; }
function getFocusableIndexFromKeypad(kIdx){ const topCount=3; const tabsCount=4; return topCount+tabsCount+kIdx; }
function getRowColFromKeypadIdx(kIdx){ for(let r=0;r<keypadRows.length;r++){ const start=keypadRowStarts[r]; const len=keypadRows[r]; if(kIdx>=start && kIdx<start+len){ return {row:r, col:kIdx-start, rowLen:len}; } } return null; }
function getKeypadIdxFromRowCol(row,col){ if(row<0||row>=keypadRows.length) return -1; const len=keypadRows[row]; if(col<0) col=0; if(col>=len) col=len-1; return keypadRowStarts[row]+col; }
function moveFocus(dir){ if(focusableElements.length===0) rebuildFocusable(); if(focusableElements.length===0) return; focusIndex+=dir; if(focusIndex<0) focusIndex=focusableElements.length-1; if(focusIndex>=focusableElements.length) focusIndex=0; const el=focusableElements[focusIndex]; if(el){ el.focus(); el.scrollIntoView({block:'nearest', behavior:'smooth'}); } }
function moveFocusGrid(dRow,dCol){
  const keypadWrap=document.getElementById('keypadWrap');
  const isKeypadVisible = keypadWrap && !keypadWrap.classList.contains('hidden');
  if(!isKeypadVisible){ if(dRow!==0) moveFocus(dRow>0?1:-1); else if(dCol!==0) moveFocus(dCol>0?1:-1); return; }
  const currentEl=document.activeElement;
  const currentFocusIdx=focusableElements.indexOf(currentEl);
  if(currentFocusIdx>=0) focusIndex=currentFocusIdx;
  const topCount=3; const tabsCount=4; const keypadStart=topCount+tabsCount;
  if(focusIndex<keypadStart){
    if(dRow>0){ focusIndex=getFocusableIndexFromKeypad(0); }
    else if(dRow<0){ focusIndex=focusableElements.length-1; }
    else { moveFocus(dCol>0?1:-1); return; }
  } else {
    const kIdx=getKeypadIndexFromFocusable(focusIndex);
    const pos=getRowColFromKeypadIdx(kIdx);
    if(!pos){ moveFocus(dCol>0?1:-1); return; }
    let newRow=pos.row; let newCol=pos.col;
    if(dRow!==0){
      newRow=pos.row+dRow;
      if(newRow<0){ focusIndex=keypadStart-1; focusableElements[focusIndex].focus(); return; }
      if(newRow>=keypadRows.length){ focusIndex=0; focusableElements[focusIndex].focus(); return; }
      const newRowLen=keypadRows[newRow]; if(newCol>=newRowLen) newCol=newRowLen-1;
      const newKIdx=getKeypadIdxFromRowCol(newRow,newCol); focusIndex=getFocusableIndexFromKeypad(newKIdx);
    } else if(dCol!==0){
      newCol=pos.col+dCol;
      const rowLen=keypadRows[pos.row];
      if(newCol<0){
        if(pos.row>0){ newRow=pos.row-1; newCol=keypadRows[newRow]-1; const newKIdx=getKeypadIdxFromRowCol(newRow,newCol); focusIndex=getFocusableIndexFromKeypad(newKIdx); }
        else { newCol=rowLen-1; const newKIdx=getKeypadIdxFromRowCol(pos.row,newCol); focusIndex=getFocusableIndexFromKeypad(newKIdx); }
      } else if(newCol>=rowLen){
        if(pos.row<keypadRows.length-1){ newRow=pos.row+1; newCol=0; const newKIdx=getKeypadIdxFromRowCol(newRow,newCol); focusIndex=getFocusableIndexFromKeypad(newKIdx); }
        else { newCol=0; const newKIdx=getKeypadIdxFromRowCol(pos.row,newCol); focusIndex=getFocusableIndexFromKeypad(newKIdx); }
      } else { const newKIdx=getKeypadIdxFromRowCol(pos.row,newCol); focusIndex=getFocusableIndexFromKeypad(newKIdx); }
    }
  }
  const el=focusableElements[focusIndex]; if(el){ el.focus(); el.scrollIntoView({block:'nearest'}); }
}
function moveFocusToFirstCard(){ rebuildFocusable(); const cards=document.querySelectorAll('#list .card-btn'); if(cards.length>0){ focusIndex=focusableElements.indexOf(cards[0]); if(focusIndex<0) focusIndex=0; cards[0].focus(); } }
function moveFocusToFirstKeypad(){ rebuildFocusable(); const keys=document.querySelectorAll('#keypad button'); if(keys.length>0){ const firstKeyIdx=getFocusableIndexFromKeypad(0); focusIndex=firstKeyIdx; keys[0].focus(); } }
function buildKeypad(){
  const kp=document.getElementById('keypad'); if(!kp) return; kp.innerHTML='';
  const mk=(label, cls, fn)=>{const b=document.createElement('button'); b.textContent=label; b.className=cls||''; b.onclick=fn; kp.appendChild(b);};
  if(currentLang==='kr'){
    [['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']].forEach(r=>r.forEach(k=>mk(k,'',()=>typeKey(k))));
    mk('스페이스','space',()=>typeKey(' ')); mk('⌫','del',()=>delKey()); mk('입력','search',()=>doSearchHide());
  } else {
    [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']].forEach(r=>r.forEach(k=>mk(k,'',()=>typeKey(k))));
    mk('Space','space',()=>typeKey(' ')); mk('⌫','del',()=>delKey()); mk('입력','search',()=>doSearchHide());
  }
  rebuildFocusable();
}
let lastItems=[], currentPage=0, isPlayer=false;
const ITEMS_PER_PAGE=10;
async function fetchTimeout(url,ms=12000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal, mode:'cors'}); clearTimeout(t); if(!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json();}catch(e){clearTimeout(t); throw e;}
}
async function searchPiped(q){
  const query=encodeURIComponent(q);
  const INSTANCES=["https://pipedapi.kavin.rocks","https://api.piped.private.coffee","https://pipedapi.moomoo.me","https://piped-api.lunar.icu","https://api.piped.privacydev.net","https://pipedapi.syncpundit.io","https://pipedapi-libre.kavin.rocks"];
  for(let i=0;i<INSTANCES.length;i++){
    const host=INSTANCES[i];
    const st=document.getElementById('statusText'); if(st) st.textContent=`Piped ${i+1}/${INSTANCES.length} 검색중... ${q}`;
    try{const d=await fetchTimeout(`${host}/search?q=${query}&filter=videos`, 8000); if(d.items && d.items.length>0) return {items:d.items, host:new URL(host).host, type:'Piped'};}catch(e){ continue; }
  }
  throw new Error('Piped 전체 실패');
}
async function searchInvidious(q){
  const query=encodeURIComponent(q);
  const INSTANCES=["https://yewtu.be","https://inv.tux.pizza","https://invidious.privacydev.net","https://iv.melmac.space","https://invidious.lunar.icu"];
  for(let i=0;i<INSTANCES.length;i++){
    const host=INSTANCES[i];
    const st=document.getElementById('statusText'); if(st) st.textContent=`Invidious ${i+1}/${INSTANCES.length} 검색중... ${q}`;
    try{
      const d=await fetchTimeout(`${host}/api/v1/search?q=${query}&type=video`, 8000);
      if(d && d.length>0){
        const items=d.map(v=>({title:v.title, uploaderName:v.author, url:'/watch?v='+v.videoId, thumbnail:v.videoThumbnails?.[0]?.url||`https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`, id:v.videoId}));
        return {items:items, host:new URL(host).host, type:'Invidious'};
      }
    }catch(e){ continue; }
  }
  throw new Error('Invidious 전체 실패');
}
async function searchAll(q){if(!q || q.trim().length===0) q='고양이'; try{ return await searchPiped(q); }catch(e1){ try{ return await searchInvidious(q); }catch(e2){ throw new Error(`${e1.message} / ${e2.message}`); } }}
function safeSetText(id, txt){const el=document.getElementById(id); if(el) el.textContent=txt;}

// V44 Herald 스타일 재생 - herald.ascents.gg/a/youtube 처럼
let ytPlayer=null;
let currentVideoId='';
let currentVideoTitle='';
let isPaused=false;
let progressInterval=null;

function onYouTubeIframeAPIReady(){
  console.log('YT API Ready V44');
}

function createHeraldPlayer(videoId, title){
  currentVideoId=videoId;
  currentVideoTitle=title || 'YouTube';
  const heraldVideo=document.getElementById('heraldVideo');
  const heraldTitle=document.getElementById('heraldTitle');
  if(heraldTitle) heraldTitle.textContent=currentVideoTitle;
  if(!heraldVideo) return;
  
  heraldVideo.innerHTML=`<div id="yt-herald"></div>`;
  
  // Herald처럼 컨트롤 없이 깔끔하게, Dpad로 조작
  ytPlayer=new YT.Player('yt-herald', {
    width:'600',
    height:'540',
    videoId:videoId,
    playerVars:{
      autoplay:1,
      playsinline:1,
      controls:0, // Herald처럼 컨트롤 숨김
      rel:0,
      fs:0,
      modestbranding:1,
      iv_load_policy:3,
      disablekb:1,
      enablejsapi:1,
      origin:window.location.origin
    },
    events:{
      'onReady': onHeraldReady,
      'onStateChange': onHeraldStateChange
    }
  });
}

function onHeraldReady(event){
  console.log('Herald Player Ready');
  event.target.playVideo();
  event.target.setVolume(100);
  startProgressTracking();
  showCenterHint('▶️', 800);
}

function onHeraldStateChange(event){
  if(event.data==YT.PlayerState.PAUSED){ isPaused=true; showCenterHint('⏸️', 800); }
  else if(event.data==YT.PlayerState.PLAYING){ isPaused=false; showCenterHint('▶️', 600); }
  else if(event.data==YT.PlayerState.ENDED){ showCenterHint('🔁 재시작', 1500); }
}

function startProgressTracking(){
  if(progressInterval) clearInterval(progressInterval);
  progressInterval=setInterval(()=>{
    if(ytPlayer && ytPlayer.getCurrentTime && ytPlayer.getDuration){
      try{
        const ct=ytPlayer.getCurrentTime();
        const dur=ytPlayer.getDuration();
        if(dur>0){
          const pct=(ct/dur*100);
          const fill=document.getElementById('heraldProgress');
          if(fill) fill.style.width=pct+'%';
          const timeEl=document.getElementById('heraldTime');
          if(timeEl){
            const cm=Math.floor(ct/60); const cs=Math.floor(ct%60);
            const dm=Math.floor(dur/60); const ds=Math.floor(dur%60);
            timeEl.textContent=`${cm}:${cs.toString().padStart(2,'0')} / ${dm}:${ds.toString().padStart(2,'0')}`;
          }
        }
      }catch(e){}
    }
  }, 500);
}

function formatTime(s){
  const m=Math.floor(s/60); const sec=Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function showCenterHint(text, dur=1000){
  const el=document.getElementById('heraldCenterHint');
  if(!el) return;
  el.textContent=text;
  el.classList.add('show');
  setTimeout(()=>{ el.classList.remove('show'); }, dur);
}

function showSideHint(side, text, dur=1000){
  const id=side==='left' ? 'heraldLeftHint' : 'heraldRightHint';
  const el=document.getElementById(id);
  if(!el) return;
  el.textContent=text;
  el.classList.add('show');
  setTimeout(()=>{ el.classList.remove('show'); }, dur);
}

function renderPage(){
  try{
    const list=document.getElementById('list'); if(!list) return; list.innerHTML='';
    const player=document.getElementById('player'); if(player) player.style.display='none';
    const pag=document.getElementById('pagination'); if(pag) pag.style.display='flex';
    list.style.display='flex'; isPlayer=false;
    const hud=document.getElementById('hud'); if(hud) hud.classList.remove('playing');
    const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE);
    const start=currentPage*ITEMS_PER_PAGE; const end=Math.min(start+ITEMS_PER_PAGE,lastItems.length);
    if(lastItems.length===0){
      list.innerHTML=`<div class="center"><b>검색 결과 없음</b><br>다른 검색어<br><button onclick="doSearchHide()" style="background:#00ff88;color:#000;border:0;padding:12px 24px;border-radius:10px;font-weight:900;margin-top:10px">다시 검색</button></div>`;
      rebuildFocusable(); return;
    }
    for(let idx=start; idx<end; idx++){
      const v=lastItems[idx]; const id=v.url?.replace('/watch?v=','')||v.id||''; const title=v.title||'No title'; const ch=v.uploaderName||v.author||''; const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
      const btn=document.createElement('button'); btn.className='card-btn'; btn.tabIndex=0;
      btn.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" loading="lazy"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
      btn.onclick=()=>{ playVideo(id, title); };
      list.appendChild(btn);
    }
    safeSetText('pageInfo', `${currentPage+1}/${totalPages}`);
    safeSetText('count', `${lastItems.length}개`);
    safeSetText('statusText', `검색 완료: ${lastItems.length}개 - Herald처럼 재생`);
    rebuildFocusable();
    setTimeout(()=>{moveFocusToFirstCard();},200);
  }catch(e){safeSetText('statusText', `렌더 오류: ${e.message}`);}
}
function changePage(dir){const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); let np=currentPage+dir; if(np<0) np=0; if(np>=totalPages) np=totalPages-1; if(np===currentPage) return; currentPage=np; renderPage();}

function playVideo(id, title){
  const list=document.getElementById('list'); if(list) list.style.display='none';
  const pag=document.getElementById('pagination'); if(pag) pag.style.display='none';
  const kw=document.getElementById('keypadWrap'); if(kw){kw.classList.add('hidden'); kw.style.display='none';}
  const player=document.getElementById('player'); if(!player) return;
  player.style.display='flex';
  const hud=document.getElementById('hud'); if(hud) hud.classList.add('playing');
  isPlayer=true;
  
  if(typeof YT!=='undefined' && YT.Player){
    createHeraldPlayer(id, title);
  } else {
    // YT API 아직 안 됐으면 직접 iframe (Herald처럼 컨트롤 없이)
    const heraldVideo=document.getElementById('heraldVideo');
    const heraldTitle=document.getElementById('heraldTitle');
    if(heraldTitle) heraldTitle.textContent=title||'YouTube';
    if(heraldVideo){
      heraldVideo.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&fs=0&rel=0&controls=0&modestbranding=1&iv_load_policy=3&enablejsapi=1&origin=${window.location.origin}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="width:600px;height:540px;border:0"></iframe>`;
    }
    setTimeout(()=>{ if(typeof YT!=='undefined' && YT.Player){ createHeraldPlayer(id, title); } },2000);
  }
  safeSetText('info','Herald 스타일 재생 - Swipe + Dpad');
}

function backToList(){
  if(ytPlayer){ try{ ytPlayer.stopVideo(); ytPlayer.destroy(); }catch(e){} ytPlayer=null; }
  if(progressInterval){ clearInterval(progressInterval); progressInterval=null; }
  const hud=document.getElementById('hud'); if(hud) hud.classList.remove('playing');
  const player=document.getElementById('player'); if(player) player.style.display='none';
  const list=document.getElementById('list'); if(list) list.style.display='flex';
  const pag=document.getElementById('pagination'); if(pag) pag.style.display='flex';
  isPlayer=false;
  const heraldVideo=document.getElementById('heraldVideo');
  if(heraldVideo) heraldVideo.innerHTML='';
  renderPage();
}

function doSearchHide(){
  commitComposing();
  let q=document.getElementById('q')?.value?.trim() || committed.trim() || '고양이';
  hideKB();
  const list=document.getElementById('list'); if(list) list.innerHTML=`<div class="center"><b>검색 중...</b><br>${q}<br><small style="color:#00ff88">서버 찾는 중...</small></div>`;
  const player=document.getElementById('player'); if(player) player.style.display='none';
  if(list) list.style.display='flex';
  (async()=>{
    try{
      const res=await searchAll(q);
      lastItems=res.items.slice(0,20);
      currentPage=0;
      safeSetText('info', res.host+' ✓ '+res.type);
      renderPage();
    }catch(e){
      if(list) list.innerHTML=`<div class="center"><b>검색 실패</b><br>${q}<br><small style="color:#ff5555">${e.message}</small><br><br><button onclick="doSearchHide()" style="background:#00ff88;color:#000;border:0;padding:12px 24px;border-radius:10px;font-weight:900">다시 시도</button></div>`;
      safeSetText('statusText', `검색 실패`);
      rebuildFocusable();
    }
  })();
}

// V44 Herald 스타일 - 리스트 네비게이션
document.addEventListener('keydown', (e)=>{
  if(isPlayer){
    // Herald처럼 Dpad로 재생 제어
    if(e.key==='ArrowLeft' || e.key==='a'){
      e.preventDefault();
      if(ytPlayer){ try{ const nt=Math.max(0, ytPlayer.getCurrentTime()-10); ytPlayer.seekTo(nt,true); showSideHint('left','⏪ -10s'); }catch(err){} }
    } else if(e.key==='ArrowRight' || e.key==='d'){
      e.preventDefault();
      if(ytPlayer){ try{ const nt=ytPlayer.getCurrentTime()+10; ytPlayer.seekTo(nt,true); showSideHint('right','+10s ⏩'); }catch(err){} }
    } else if(e.key==='ArrowUp' || e.key==='w'){
      e.preventDefault();
      if(ytPlayer){ try{ const v=Math.min(100, ytPlayer.getVolume()+10); ytPlayer.setVolume(v); showSideHint('right',`🔊 ${v}%`); }catch(err){} }
    } else if(e.key==='ArrowDown' || e.key==='s'){
      e.preventDefault();
      if(ytPlayer){ try{ const v=Math.max(0, ytPlayer.getVolume()-10); ytPlayer.setVolume(v); showSideHint('left',`🔉 ${v}%`); }catch(err){} }
    } else if(e.key==='Enter' || e.key===' '){
      e.preventDefault();
      if(ytPlayer){
        try{
          if(isPaused){ ytPlayer.playVideo(); showCenterHint('▶️'); }
          else { ytPlayer.pauseVideo(); showCenterHint('⏸️'); }
        }catch(err){}
      }
    } else if(e.key==='Escape' || e.key==='Backspace'){
      e.preventDefault(); backToList();
    }
    return;
  }
  if(e.key==='ArrowDown'){ e.preventDefault(); moveFocusGrid(1,0); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); moveFocusGrid(-1,0); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); moveFocusGrid(0,1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); moveFocusGrid(0,-1); }
  else if(e.key==='Escape'){
    const kw=document.getElementById('keypadWrap');
    if(kw && !kw.classList.contains('hidden')) hideKB();
  }
});

// Herald 스타일 - Swipe 제스처로 재생 제어
let hStartX=0, hStartY=0, hStartTime=0;
function heraldGestureStart(x,y){ hStartX=x; hStartY=y; hStartTime=Date.now(); }
function heraldGestureEnd(x,y){
  const dx=x-hStartX; const dy=y-hStartY; const dt=Date.now()-hStartTime;
  const ax=Math.abs(dx); const ay=Math.abs(dy);
  if(!isPlayer) return;
  
  // 탭 (Index tap) - Herald처럼 재생/일시정지
  if(dt<300 && ax<20 && ay<20){
    if(ytPlayer){
      try{
        if(isPaused){ ytPlayer.playVideo(); showCenterHint('▶️'); }
        else { ytPlayer.pauseVideo(); showCenterHint('⏸️'); }
      }catch(e){}
    }
    return;
  }
  
  if(ax>60 || ay>60){
    if(ax>ay){
      // 좌우 스와이프 - 탐색 (Herald: Swipe)
      if(ytPlayer){
        const seek=dx>0 ? 10 : -10;
        try{
          const nt=Math.max(0, ytPlayer.getCurrentTime()+seek);
          ytPlayer.seekTo(nt,true);
          showSideHint(seek>0?'right':'left', seek>0?`+${seek}s ⏩`:`⏪ ${seek}s`);
        }catch(e){}
      }
    } else {
      // 상하 스와이프 - 볼륨
      if(ytPlayer){
        const volChange=dy<0 ? 10 : -10;
        try{
          const nv=Math.max(0, Math.min(100, ytPlayer.getVolume()+volChange));
          ytPlayer.setVolume(nv);
          showSideHint(volChange>0?'right':'left', `🔊 ${nv}%`);
        }catch(e){}
      }
    }
  }
}

const heraldPlayback=document.getElementById('heraldPlayback');
if(heraldPlayback){
  heraldPlayback.addEventListener('touchstart', (e)=>{ if(e.touches.length===1) heraldGestureStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  heraldPlayback.addEventListener('touchend', (e)=>{ if(e.changedTouches.length===1) heraldGestureEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, {passive:true});
  heraldPlayback.addEventListener('mousedown', (e)=>{ heraldGestureStart(e.clientX, e.clientY); });
  heraldPlayback.addEventListener('mouseup', (e)=>{ heraldGestureEnd(e.clientX, e.clientY); });
}

// 리스트 스와이프
let touchStartY=0, touchStartX=0;
document.addEventListener('touchstart', (e)=>{
  if(isPlayer) return;
  touchStartY=e.touches[0].clientY;
  touchStartX=e.touches[0].clientX;
}, {passive:true});
document.addEventListener('touchend', (e)=>{
  if(isPlayer) return;
  const diffY=e.changedTouches[0].clientY - touchStartY;
  const diffX=e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(diffY)>Math.abs(diffX)){ if(Math.abs(diffY)>50){ if(diffY>0) moveFocusGrid(-1,0); else moveFocusGrid(1,0); } }
  else { if(Math.abs(diffX)>50){ if(diffX>0) moveFocusGrid(0,-1); else moveFocusGrid(0,1); } }
}, {passive:true});

buildKeypad();
setTimeout(()=>{ committed='고양이'; updateInput(); doSearchHide(); },800);
setTimeout(()=>{rebuildFocusable();},1000);
</script>
