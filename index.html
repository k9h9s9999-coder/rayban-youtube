<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V36 Search Dual</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:3px solid #00ff88}
.hud.playing .header, .hud.playing .search-row, .hud.playing .status, .hud.playing .footer, .hud.playing .pagination, .hud.playing .keypad-wrap{display:none !important}
.hud.playing .content{flex:1;height:600px;background:#000}
.hud.playing .player{height:600px;width:600px;background:#000;display:flex !important}
.hud.playing .player iframe{height:600px !important;width:600px !important;border:0}
.header{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;font-size:12px}
.search-row{display:flex;gap:6px;padding:8px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#111;border:3px solid #00ff88;border-radius:12px;padding:14px 12px;color:#fff;font-size:18px;outline:none}
.search-row button{background:#00ff88;color:#000;border:0;border-radius:12px;padding:0 14px;font-weight:900;font-size:15px;min-width:70px;height:50px}
.search-row button.kb{background:#222;color:#00ff88;border:3px solid #00ff88;min-width:90px}
.status{height:22px;padding:0 10px;font-size:9px;color:#00ff88;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#121212;min-height:0}
.list{flex:1;overflow:hidden;padding:6px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.card-btn{display:flex;gap:8px;align-items:center;background:#1e1e1e;border:2px solid transparent;border-radius:10px;padding:8px;width:100%;text-align:left;min-height:54px;color:#fff}
.thumb{width:80px;height:44px;border-radius:6px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:11px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:8px;color:#aaa}
.num{background:#2a2a2a;color:#00ff88;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;flex-shrink:0}
.player{flex:1;display:none;background:#000}
.player iframe{flex:1;width:100%;border:0}
.pagination{height:40px;display:flex;gap:8px;padding:6px;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0}
.page-btn{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:8px;font-size:12px;font-weight:800;height:32px}
.footer{height:10px;background:#000}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#666;padding:20px;text-align:center}
.version{position:absolute;top:2px;right:2px;background:#00ff88;color:#000;font-size:9px;font-weight:900;padding:3px 6px;border-radius:4px;z-index:99}
.keypad-wrap{display:flex;flex-direction:column;background:#000;border-top:4px solid #00ff88;flex-shrink:0;height:280px;overflow:hidden}
.keypad-wrap.hidden{display:none !important}
.keypad-tabs{display:flex;gap:4px;padding:6px;background:#111;flex-shrink:0}
.keypad-tabs button{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#1e1e1e;color:#888;font-size:11px;font-weight:800;min-height:36px}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad{display:grid;gap:5px;padding:8px;flex:1;overflow-y:auto;align-content:start;background:#000}
.keypad.kr{grid-template-columns:repeat(10,1fr)}
.keypad button{background:#222;border:2px solid #444;color:#fff;border-radius:10px;font-size:16px;font-weight:700;min-height:48px}
.keypad button.del{background:#331111;color:#ff5555;border-color:#ff3333}
.keypad button.search{background:#00ff88;color:#000;border-color:#00ff88;font-weight:900}
.keypad button.space{background:#111;color:#00ff88;border-color:#00ff88;grid-column:span 4}
</style>
</head>
<body>
<div class="hud" id="hud">
<div class="version">V36 검색 듀얼</div>
<div class="header"><div>RB YouTube V36</div><div style="font-size:9px;color:#00ff88" id="pageInfo">V36</div></div>
<div class="search-row">
<input id="q" type="text" readonly placeholder="여기 누르면 키보드" onclick="showKB()">
<button id="kbBtn" class="kb" onclick="toggleKB()">⌨️ 키보드</button>
<button id="searchBtn" onclick="doSearchHide()">검색</button>
</div>
<div class="status"><span id="statusText">V36: Piped+Invidious 듀얼 검색</span><span id="info"></span></div>
<div class="content" id="content"><div id="list" class="list"></div><div id="player" class="player"></div></div>
<div class="pagination" id="pagination">
<button class="page-btn" onclick="changePage(-1)">◀ 이전</button>
<button class="page-btn" onclick="changePage(1)">다음 ▶</button>
</div>
<div id="keypadWrap" class="keypad-wrap hidden">
<div class="keypad-tabs">
<button id="tabKr" class="active" onclick="setLang('kr')">한글</button>
<button id="tabEn" onclick="setLang('en')">ENG</button>
<button onclick="clearInput()">지우기</button>
<button onclick="hideKB()">닫기</button>
</div>
<div id="keypad" class="keypad kr"></div>
</div>
<div class="footer"></div>
</div>
<script>
console.log('V36 Dual Search');
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choIdx(c){return CHO.indexOf(c);} function jungIdx(j){return JUNG.indexOf(j);} function jongIdx(j){return JONG.indexOf(j);}
function makeSyllable(cho,jung,jong){if(cho<0||jung<0) return null; return String.fromCharCode(0xAC00+cho*21*28+jung*28+jong);}
let committed=''; let composing={cho:-1,jung:-1,jong:0};
function getComposingChar(){if(composing.cho>=0&&composing.jung>=0){return makeSyllable(composing.cho,composing.jung,composing.jong);} if(composing.cho>=0&&composing.jung<0){return CHO[composing.cho];} if(composing.cho<0&&composing.jung>=0){return JUNG[composing.jung];} return '';}
function commitComposing(){const ch=getComposingChar(); if(ch) committed+=ch; composing={cho:-1,jung:-1,jong:0};}
function updateInput(){const d=committed+getComposingChar(); document.getElementById('q').value=d; document.getElementById('statusText').textContent=d?`입력: ${d}`:`V36: 검색결과 안나오면 알려주세요`;}
function isConsonant(j){return CHO.includes(j);}
function inputHangul(jamo){
  if(jamo===' '){commitComposing(); committed+=' '; updateInput(); return;}
  const DC={'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'}; const DJC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'}; const DJOC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'}; const DJS={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  if(isConsonant(jamo)){
    const cIdx=choIdx(jamo);
    if(composing.cho<0&&composing.jung<0){composing.cho=cIdx;}
    else if(composing.cho>=0&&composing.jung<0){const prev=CHO[composing.cho]; const comb=DC[prev+jamo]; if(comb){composing.cho=choIdx(comb);} else {committed+=CHO[composing.cho]; composing.cho=cIdx;}}
    else if(composing.jung>=0&&composing.jong==0){const ji=jongIdx(jamo); if(ji>0){composing.jong=ji;} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
    else if(composing.jong>0){const prevJ=JONG[composing.jong]; const comb=DJOC[prevJ+jamo]; if(comb){composing.jong=jongIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,composing.jong); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
  } else {
    const vIdx=jungIdx(jamo);
    if(composing.cho<0){composing.cho=choIdx('ㅇ'); composing.jung=vIdx;}
    else if(composing.jung<0){composing.jung=vIdx;}
    else if(composing.jong==0){const prevV=JUNG[composing.jung]; const comb=DJC[prevV+jamo]; if(comb){composing.jung=jungIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:choIdx('ㅇ'),jung:vIdx,jong:0};}}
    else {const jongChar=JONG[composing.jong]; let rem=0; let nextC=jongChar; if(DJS[jongChar]){const p=DJS[jongChar]; rem=jongIdx(p[0]); nextC=p[1];} else {rem=0; nextC=jongChar;} const syl=makeSyllable(composing.cho,composing.jung,rem); committed+=syl; composing={cho:choIdx(nextC),jung:vIdx,jong:0};}
  }
  updateInput();
}
function delKey(){if(getComposingChar()){if(composing.jong>0){composing.jong=0;} else if(composing.jung>=0){composing.jung=-1;} else if(composing.cho>=0){composing.cho=-1;}} else {if(committed.length>0) committed=committed.slice(0,-1);} updateInput();}
function clearInput(){committed=''; composing={cho:-1,jung:-1,jong:0}; updateInput();}
function typeKey(k){if(currentLang==='kr'){if(k===' ') inputHangul(' '); else inputHangul(k);} else {commitComposing(); committed+=k; updateInput();}}

let currentLang='kr';
function setLang(lang){currentLang=lang; document.getElementById('tabKr').classList.toggle('active',lang==='kr'); document.getElementById('tabEn').classList.toggle('active',lang==='en'); buildKeypad();}
function toggleKB(){const w=document.getElementById('keypadWrap'); if(w.classList.contains('hidden')){w.classList.remove('hidden'); w.style.display='flex'; document.getElementById('kbBtn').textContent='⌨️ 닫기';} else {w.classList.add('hidden'); w.style.display='none'; document.getElementById('kbBtn').textContent='⌨️ 키보드';}}
function showKB(){const w=document.getElementById('keypadWrap'); w.classList.remove('hidden'); w.style.display='flex'; document.getElementById('kbBtn').textContent='⌨️ 닫기';}
function hideKB(){const w=document.getElementById('keypadWrap'); w.classList.add('hidden'); w.style.display='none'; document.getElementById('kbBtn').textContent='⌨️ 키보드';}
function buildKeypad(){
  const kp=document.getElementById('keypad'); kp.innerHTML=''; kp.className='keypad '+currentLang;
  const mk=(label, cls, fn)=>{const b=document.createElement('button'); b.textContent=label; b.className=cls||''; b.onclick=fn; kp.appendChild(b);};
  if(currentLang==='kr'){
    [['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']].forEach(r=>r.forEach(k=>mk(k,'',()=>typeKey(k))));
    mk('스페이스','space',()=>typeKey(' ')); mk('⌫','del',()=>delKey()); mk('입력','search',()=>doSearchHide());
  } else {
    [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']].forEach(r=>r.forEach(k=>mk(k,'',()=>typeKey(k))));
    mk('Space','space',()=>typeKey(' ')); mk('⌫','del',()=>delKey()); mk('입력','search',()=>doSearchHide());
  }
}
let lastItems=[], currentPage=0, isPlayer=false;
const ITEMS_PER_PAGE=10;

async function fetchTimeout(url,ms=12000){
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(url,{signal:c.signal, mode:'cors'});
    clearTimeout(t);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  }catch(e){clearTimeout(t); throw e;}
}

async function searchPiped(q){
  const INSTANCES=[
    "https://pipedapi.kavin.rocks",
    "https://api.piped.private.coffee",
    "https://pipedapi.moomoo.me",
    "https://piped-api.lunar.icu",
    "https://api.piped.privacydev.net",
    "https://pipedapi.syncpundit.io",
    "https://pipedapi-libre.kavin.rocks"
  ];
  for(let i=0;i<INSTANCES.length;i++){
    const host=INSTANCES[i];
    document.getElementById('statusText').textContent=`Piped ${i+1}/${INSTANCES.length} 시도중... ${new URL(host).hostname}`;
    try{
      const d=await fetchTimeout(`${host}/search?q=${encodeURIComponent(q)}&filter=videos`, 8000);
      if(d.items && d.items.length>0) return {items:d.items, host:new URL(host).host, type:'Piped'};
    }catch(e){ console.log(`Piped ${host} fail`, e); continue; }
  }
  throw new Error('Piped all fail');
}

async function searchInvidious(q){
  const INSTANCES=[
    "https://yewtu.be",
    "https://inv.tux.pizza",
    "https://invidious.privacydev.net",
    "https://iv.melmac.space",
    "https://invidious.lunar.icu"
  ];
  for(let i=0;i<INSTANCES.length;i++){
    const host=INSTANCES[i];
    document.getElementById('statusText').textContent=`Invidious ${i+1}/${INSTANCES.length} 시도중... ${new URL(host).hostname}`;
    try{
      const d=await fetchTimeout(`${host}/api/v1/search?q=${encodeURIComponent(q)}&type=video`, 8000);
      if(d && d.length>0){
        const items=d.map(v=>({
          title:v.title,
          uploaderName:v.author,
          url:'/watch?v='+v.videoId,
          thumbnail:v.videoThumbnails ? v.videoThumbnails[0].url : `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`,
          id:v.videoId
        }));
        return {items:items, host:new URL(host).host, type:'Invidious'};
      }
    }catch(e){ console.log(`Invidious ${host} fail`, e); continue; }
  }
  throw new Error('Invidious all fail');
}

async function searchAll(q){
  try{
    return await searchPiped(q);
  }catch(e1){
    console.log('Piped failed, trying Invidious', e1);
    document.getElementById('statusText').textContent=`Piped 실패, Invidious로 전환...`;
    try{
      return await searchInvidious(q);
    }catch(e2){
      throw new Error(`Piped: ${e1.message} / Invidious: ${e2.message}`);
    }
  }
}

function renderPage(){
  const list=document.getElementById('list'); list.innerHTML=''; document.getElementById('player').style.display='none'; document.getElementById('pagination').style.display='flex'; list.style.display='flex'; isPlayer=false; document.getElementById('hud').classList.remove('playing');
  const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); const start=currentPage*ITEMS_PER_PAGE; const end=Math.min(start+ITEMS_PER_PAGE,lastItems.length);
  if(lastItems.length===0){
    list.innerHTML=`<div class="center"><b>검색 결과 없음</b><br>다른 검색어로 시도해보세요<br><button onclick="doSearchHide()" style="background:#00ff88;color:#000;border:0;padding:12px 24px;border-radius:10px;font-weight:900;margin-top:10px">다시 검색</button></div>`;
    return;
  }
  for(let idx=start; idx<end; idx++){
    const v=lastItems[idx]; const id=v.url?.replace('/watch?v=','')||v.id||''; const title=v.title||'No title'; const ch=v.uploaderName||v.author||''; const thumb=v.thumbnail||(v.videoThumbnails? v.videoThumbnails[0].url : `https://i.ytimg.com/vi/${id}/mqdefault.jpg`);
    const btn=document.createElement('button'); btn.className='card-btn';
    btn.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" loading="lazy"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
    btn.onclick=()=>{ playVideo(id); };
    list.appendChild(btn);
  }
  document.getElementById('pageInfo').textContent=`${currentPage+1}/${totalPages}`; 
  document.getElementById('count').textContent=`${lastItems.length}개`;
  document.getElementById('statusText').textContent=`검색 완료: ${lastItems.length}개 - 영상 선택`;
}
function changePage(dir){const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); let np=currentPage+dir; if(np<0) np=0; if(np>=totalPages) np=totalPages-1; if(np===currentPage) return; currentPage=np; renderPage();}
function playVideo(id){
  document.getElementById('list').style.display='none';
  document.getElementById('pagination').style.display='none';
  document.getElementById('keypadWrap').classList.add('hidden');
  const player=document.getElementById('player');
  player.style.display='flex';
  player.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&fs=1&rel=0&controls=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  isPlayer=true;
  document.getElementById('hud').classList.add('playing');
}
function backToList(){document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex'; document.getElementById('pagination').style.display='flex'; isPlayer=false; document.getElementById('hud').classList.remove('playing'); renderPage();}

function doSearchHide(){
  commitComposing();
  let q=document.getElementById('q').value.trim();
  if(!q) q='고양이';
  console.log('Search query:', q);
  hideKB();
  document.getElementById('list').innerHTML=`<div class="center"><b>검색 중...</b><br>${q}<br><small style="color:#00ff88" id="searchDetail">서버 연결 중...</small></div>`;
  document.getElementById('player').style.display='none'; 
  document.getElementById('list').style.display='flex';
  (async()=>{
    try{
      const res=await searchAll(q);
      lastItems=res.items.slice(0,20);
      currentPage=0;
      document.getElementById('info').textContent=res.host+' ✓ '+res.type;
      renderPage();
    }catch(e){
      console.error('All search failed', e);
      document.getElementById('list').innerHTML=`<div class="center"><b>검색 실패</b><br>${q}<br><small style="color:#ff5555">${e.message}</small><br><br><button onclick="doSearchHide()" style="background:#00ff88;color:#000;border:0;padding:12px 24px;border-radius:10px;font-weight:900">다시 시도</button><br><br><small>1. 와이파이 확인<br>2. 검색어를 영어로 바꿔보세요<br>3. 'BTS' 같은 짧은 단어로 테스트</small></div>`;
      document.getElementById('statusText').textContent=`검색 실패`;
    }
  })();
}
buildKeypad();
setTimeout(()=>{ committed='고양이'; updateInput(); doSearchHide(); },800);
</script>
</body>
</html>
