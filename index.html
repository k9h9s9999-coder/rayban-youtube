<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1">
<title>Ray-Ban YouTube - Fixed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.hud{width:600px;height:600px;background:#121212;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #2a2a2a;position:relative}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#1a1a1a;border-bottom:1px solid #2a2a2a}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.badge{background:#333;color:#aaa;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:.5px}
.live{color:#00ff88;font-size:12px;font-weight:700;letter-spacing:1px}
.search-row{display:flex;gap:8px;padding:12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a}
.search-row input{flex:1;background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:12px 14px;color:#fff;font-size:16px;outline:none}
.search-row input:focus{border-color:#00ff88}
.search-row button{background:#fff;color:#000;border:0;border-radius:12px;padding:0 20px;font-weight:800;font-size:14px;cursor:pointer}
.search-row button:active{transform:scale(.97)}
.status{padding:8px 16px;font-size:12px;color:#ff6b7a;min-height:28px}
.content{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:10px;background:#1e1e1e;border-radius:12px;padding:8px;cursor:pointer;border:1px solid transparent}
.card:hover{border-color:#333;background:#242424}
.thumb{width:96px;height:54px;border-radius:8px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:11px;color:#999;margin-top:4px}
.player-wrap{flex:1;display:flex;flex-direction:column;background:#000}
.player-wrap iframe{width:100%;flex:1;border:0}
.back{padding:10px 16px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;gap:8px}
.back button{background:#2a2a2a;border:0;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.footer{padding:6px 12px;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:space-between;font-size:10px;color:#666;letter-spacing:1px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#888;text-align:center;padding:20px}
.center b{color:#fff}
.retry{background:#2a2a2a;color:#fff;border:0;padding:10px 18px;border-radius:20px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="hud">
  <div class="header">
    <div class="logo"><span style="background:#fff;color:#000;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900">RB</span> Ray-Ban Display <span class="badge">HUD</span></div>
    <div class="live">● LIVE</div>
  </div>
  <div class="search-row">
    <input id="q" placeholder="검색어 입력 (예: 고양이, BTS, 요리)" value="Cat" onkeydown="if(event.key==='Enter') doSearch()">
    <button onclick="doSearch()">Search</button>
  </div>
  <div id="status" class="status"></div>
  <div id="content" class="content">
    <div class="center"><b>검색어를 입력하고 Search를 누르세요</b><span>600×600 HUD 최적화 • API 키 필요 없음</span></div>
  </div>
  <div class="footer"><span>FIXED • MULTI-PIPED • NO KEY • 600×600 HUD</span><span id="instance">ready</span></div>
</div>

<script>
const PIPED_INSTANCES = [
  "https://pipedapi.kavin.rocks",
  "https://api.piped.private.coffee",
  "https://pipedapi.adminforge.de",
  "https://pipedapi.in.projectsegfau.lt",
  "https://pipedapi.syncpundi.com",
  "https://pipedapi.drgns.space",
  "https://pipedapi.leptosinfra.com",
  "https://api.piped.privacydev.net"
];

async function fetchWithTimeout(url, ms=6000){
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url, {signal: ctrl.signal, headers: {'Accept':'application/json'}});
    clearTimeout(id);
    if(!r.ok) throw new Error('http '+r.status);
    return await r.json();
  }catch(e){
    clearTimeout(id);
    throw e;
  }
}

async function searchPiped(query){
  let lastErr='';
  for(let i=0;i<PIPED_INSTANCES.length;i++){
    const base = PIPED_INSTANCES[i];
    document.getElementById('instance').textContent = `try ${i+1}/${PIPED_INSTANCES.length} ${new URL(base).hostname}`;
    try{
      const url = `${base}/search?q=${encodeURIComponent(query)}&filter=videos`;
      const data = await fetchWithTimeout(url, 7000);
      if(data && data.items && data.items.length>0) return {data, base};
      if(data && data.items) lastErr='empty';
      else lastErr='no items';
    }catch(e){
      lastErr = e.message;
      continue;
    }
  }
  throw new Error(lastErr||'all instances failed');
}

function renderList(items){
  const c = document.getElementById('content');
  c.innerHTML = '';
  items.forEach(v=>{
    const id = v.url?.replace('/watch?v=','') || v.id || '';
    const title = v.title || v.name || 'No title';
    const ch = v.uploaderName || v.uploader || v.author || '';
    const thumb = v.thumbnail || (v.thumbnails && v.thumbnails[0]) || `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `<img class="thumb" src="${thumb}" onerror="this.src='https://i.ytimg.com/vi/${id}/mqdefault.jpg'"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
    card.onclick = ()=> playVideo(id, title);
    c.appendChild(card);
  });
}

function playVideo(id, title){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="player-wrap">
    <div class="back"><button onclick="doSearch(true)">← 뒤로가기</button><button onclick="copyLink('${id}')">링크 복사</button></div>
    <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>`;
  document.getElementById('status').textContent = title;
}

function fallbackYoutubeSearch(query){
  const c = document.getElementById('content');
  c.innerHTML = `<div class="player-wrap">
    <div class="back"><button onclick="doSearch(true)">← 뒤로가기</button><span style="font-size:12px;color:#999;padding:8px">Piped 실패 → 유튜브 직접 검색</span></div>
    <iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=0" allow="encrypted-media; fullscreen"></iframe>
  </div>`;
  document.getElementById('status').textContent = 'Piped 서버 일시 오류 - 유튜브 직접 검색 모드로 전환됨';
}

let lastQuery = '';
let lastItems = [];

async function doSearch(isBack=false){
  const input = document.getElementById('q');
  let query = input.value.trim();
  if(!query) query = 'Cat';
  if(isBack && lastItems.length){
    renderList(lastItems);
    document.getElementById('status').textContent = `${lastQuery} - ${lastItems.length}개 결과`;
    return;
  }
  lastQuery = query;
  document.getElementById('status').textContent = '검색 중...';
  document.getElementById('content').innerHTML = '<div class="center"><b>검색 중...</b><span>여러 서버를 시도하고 있어요</span></div>';
  try{
    const {data, base} = await searchPiped(query);
    lastItems = data.items.slice(0,20);
    document.getElementById('instance').textContent = new URL(base).hostname + ' ✓';
    document.getElementById('status').textContent = `${query} - ${lastItems.length}개 결과 (${new URL(base).hostname})`;
    renderList(lastItems);
  }catch(e){
    console.error(e);
    document.getElementById('status').textContent = `검색 실패 - ${e.message}. 유튜브 직접 모드로 전환`;
    fallbackYoutubeSearch(query);
  }
}

function copyLink(id){
  const url = `https://www.youtube.com/watch?v=${id}`;
  navigator.clipboard.writeText(url);
  document.getElementById('status').textContent = '링크 복사됨: '+url;
}

// auto search on load
setTimeout(()=>doSearch(), 500);
</script>
</body>
</html>
