<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V24 V12처럼 재생시 유튜브만</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:3px solid #00ff88}
.hud.playing{border-radius:0;border:0;background:#000}
.hud.playing .header, .hud.playing .search-row, .hud.playing .status, .hud.playing .hint, .hud.playing .footer, .hud.playing .pagination, .hud.playing .quick, .hud.playing .keypad-wrap, .hud.playing .controls{display:none !important}
.hud.playing .content{flex:1;height:600px;background:#000}
.hud.playing .player{height:600px;width:600px;background:#000;display:flex !important}
.hud.playing .player iframe{height:600px !important;width:600px !important;border:0;background:#000}
.header{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row{display:flex;gap:4px;padding:6px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#0a0a0a;border:2px solid #00ff88;border-radius:10px;padding:10px 8px;color:#fff;font-size:15px;outline:none;min-width:0}
.search-row input:focus{box-shadow:0 0 0 3px rgba(0,255,136,.4)}
.search-row button{background:#00ff88;color:#000;border:0;border-radius:10px;padding:0 8px;font-weight:900;font-size:12px;min-width:50px;height:42px;outline:none;flex-shrink:0}
.search-row button.kb{background:#1e1e1e;color:#00ff88;border:1px solid #00ff88;min-width:56px;font-size:13px}
.search-row button.kb.active{background:#00ff88;color:#000}
.status{height:18px;padding:0 10px;font-size:9px;color:#00ff88;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#121212}
.list{flex:1;overflow:hidden;padding:4px 6px;display:flex;flex-direction:column;gap:4px}
.card-btn{display:flex;gap:6px;align-items:center;background:#1e1e1e;border:2px solid transparent;border-radius:10px;padding:6px;width:100%;text-align:left;cursor:pointer;min-height:58px;outline:none;color:#fff}
.card-btn:focus{border-color:#00ff88;background:#2a2a2a;transform:scale(1.02);box-shadow:0 0 0 3px rgba(0,255,136,.3)}
.thumb{width:86px;height:50px;border-radius:6px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:11px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:8px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{background:#2a2a2a;color:#00ff88;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex-shrink:0}
.player{flex:1;display:flex;flex-direction:column;background:#000;position:relative;display:none}
.player iframe{flex:1;width:100%;border:0;background:#000}
.controls{display:flex;gap:4px;padding:6px;background:#1a1a1a;flex-shrink:0}
.ctrl{flex:1;background:#2a2a2a;border:0;color:#fff;padding:10px 2px;border-radius:8px;font-size:11px;font-weight:800;outline:none}
.quick{display:flex;gap:4px;padding:4px 6px;background:#0f0f0f;border-top:1px solid #222;flex-shrink:0;overflow-x:auto}
.quick button{background:#1e1e1e;border:1px solid #333;color:#00ff88;border-radius:16px;padding:5px 10px;font-size:10px;font-weight:800;white-space:nowrap;outline:none;flex-shrink:0}
.quick button:focus{background:#00ff88;color:#000}
.pagination{height:36px;display:flex;gap:6px;padding:4px 6px;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0}
.page-btn{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:8px;font-size:11px;font-weight:800;outline:none;height:30px}
.page-btn:focus{border-color:#00ff88;background:#00ff88;color:#000}
.footer{height:12px;padding:0 8px;background:#000;display:flex;justify-content:space-between;font-size:7px;color:#555;flex-shrink:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#777;padding:20px;text-align:center}
.hint{background:#00ff88;color:#000;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:800;margin:3px 6px;text-align:center}
.version{position:absolute;top:2px;right:2px;background:#00ff88;color:#000;font-size:7px;font-weight:900;padding:2px 5px;border-radius:4px;z-index:99}
.keypad-wrap{display:flex;flex-direction:column;background:#0a0a0a;border-top:2px solid #00ff88;flex-shrink:0;height:220px;overflow:hidden}
.keypad-wrap.hidden{display:none !important}
.keypad-tabs{display:flex;gap:4px;padding:6px;background:#111;flex-shrink:0}
.keypad-tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid #333;background:#1e1e1e;color:#888;font-size:11px;font-weight:800;outline:none;min-height:32px}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad{display:grid;gap:4px;padding:6px;flex:1;overflow-y:auto;align-content:start}
.keypad.kr{grid-template-columns:repeat(10,1fr)}
.keypad button{background:#1e1e1e;border:1px solid #333;color:#fff;padding:10px 2px;border-radius:8px;font-size:14px;font-weight:700;min-height:42px;outline:none;cursor:pointer}
.keypad button:focus{background:#00ff88 !important;color:#000 !important;border-color:#00ff88 !important;transform:scale(1.1);box-shadow:0 0 0 3px rgba(0,255,136,.5);z-index:2}
.keypad button.del{background:#ff3b30;color:#fff;border-color:#ff3b30}
.keypad button.search{background:#00ff88;color:#000;border-color:#00ff88;font-weight:900}
.keypad button.special{background:#2a2a2a;color:#00ff88;border-color:#00ff88}

/* V12처럼 재생시 유튜브만 - 오버레이 */
.play-overlay{display:none;position:absolute;top:0;left:0;width:600px;height:600px;z-index:100;pointer-events:none}
.hud.playing .play-overlay{display:flex;flex-direction:column;justify-content:space-between;pointer-events:auto;background:transparent}
.play-top{height:60px;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;background:linear-gradient(to bottom, rgba(0,0,0,.85), transparent);opacity:0;transition:opacity .3s}
.play-bottom{height:60px;display:flex;justify-content:space-between;align-items:flex-end;padding:10px;background:linear-gradient(to top, rgba(0,0,0,.85), transparent);opacity:0;transition:opacity .3s}
.play-overlay.show .play-top, .play-overlay.show .play-bottom{opacity:1}
.play-btn{background:rgba(0,0,0,.75);color:#fff;border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:8px 16px;font-size:12px;font-weight:800;backdrop-filter:blur(8px);outline:none}
.play-btn:focus{background:#00ff88;color:#000;border-color:#00ff88}
.play-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#00ff88;border:1px solid #00ff88;border-radius:14px;padding:14px 18px;font-size:12px;font-weight:800;text-align:center;pointer-events:none;opacity:1;transition:opacity .5s;z-index:101}
.play-hint.hide{opacity:0}
</style>
</head>
<body>
<div class="hud" id="hud">
<div class="version">V24 V12 재생모드</div>
<div class="header"><div>RB YouTube <span style="font-size:8px;background:#00ff88;color:#000;padding:2px 5px;border-radius:3px;font-weight:900">V24 V12처럼 유튜브만</span></div><div style="font-size:9px;color:#00ff88" id="pageInfo">1/2</div></div>
<div class="search-row">
<input id="q" type="text" readonly tabindex="0" placeholder="⌨️ 키보드 눌러서 입력" value="">
<button id="kbBtn" class="kb active" tabindex="0" onclick="toggleKeypad()">⌨️ 키보드</button>
<button id="searchBtn" tabindex="0" onclick="doSearch()">검색</button>
</div>
<div class="status"><span id="statusText">V24: V12처럼 재생시 유튜브 화면만 꽉 채움</span><span id="info">ready</span></div>
<div class="hint">✅ V12처럼 재생 누르면 바로 유튜브만 600x600 / 탭하면 버튼 / Esc=목록</div>
<div class="quick" id="quick">
<button tabindex="0" onclick="setQuery('고양이')">고양이</button>
<button tabindex="0" onclick="setQuery('아이유')">아이유</button>
<button tabindex="0" onclick="setQuery('뉴스')">뉴스</button>
<button tabindex="0" onclick="setQuery('요리')">요리</button>
<button tabindex="0" onclick="setQuery('게임')">게임</button>
</div>
<div class="content" id="content"><div id="list" class="list"></div><div id="player" class="player"></div></div>
<div class="pagination" id="pagination">
<button class="page-btn" id="prevBtn" tabindex="0" onclick="changePage(-1)">◀ 이전</button>
<button class="page-btn" id="nextBtn" tabindex="0" onclick="changePage(1)">다음 10개 ▶</button>
</div>
<div id="keypadWrap" class="keypad-wrap">
<div class="keypad-tabs">
<button id="tabKr" class="active" tabindex="0" onclick="setLang('kr')">한글</button>
<button id="tabEn" tabindex="0" onclick="setLang('en')">ENG</button>
<button tabindex="0" onclick="clearInput()" style="background:#333;color:#fff">지우기</button>
<button tabindex="0" onclick="hideKeypad()" style="background:#ff3b30;color:#fff">▼ 닫기</button>
</div>
<div id="keypad" class="keypad kr"></div>
</div>
<div class="footer"><span>V24 V12 재생모드 • 재생시 유튜브만 • 20개</span><span id="count">0개</span></div>

<!-- V12처럼 재생시 유튜브만 보이는 오버레이 -->
<div class="play-overlay" id="playOverlay" onclick="toggleOverlay()">
<div class="play-top">
<button class="play-btn" tabindex="0" onclick="backToList(); event.stopPropagation();">← 목록 (Esc)</button>
<button class="play-btn" tabindex="0" onclick="nextVideo(1); event.stopPropagation();">다음 ▶</button>
</div>
<div class="play-hint" id="playHint">V12처럼 유튜브만 보기<br><small>탭하면 버튼 / Esc=목록 / 스와이프=다음</small></div>
<div class="play-bottom">
<button class="play-btn" tabindex="0" onclick="nextVideo(-1); event.stopPropagation();">◀ 이전</button>
<button class="play-btn" tabindex="0" onclick="backToList(); event.stopPropagation();">✕ 닫기</button>
</div>
</div>

</div>
<script>
console.log('V24 V12 재생모드 - 유튜브만');

// 한글 조합
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choIdx(c){return CHO.indexOf(c);} function jungIdx(j){return JUNG.indexOf(j);} function jongIdx(j){return JONG.indexOf(j);}
function makeSyllable(cho,jung,jong){if(cho<0||jung<0) return null; return String.fromCharCode(0xAC00+cho*21*28+jung*28+jong);}
let committed=''; let composing={cho:-1,jung:-1,jong:0};
function getComposingChar(){if(composing.cho>=0&&composing.jung>=0){return makeSyllable(composing.cho,composing.jung,composing.jong);} if(composing.cho>=0&&composing.jung<0){return CHO[composing.cho];} if(composing.cho<0&&composing.jung>=0){return JUNG[composing.jung];} return '';}
function commitComposing(){const ch=getComposingChar(); if(ch) committed+=ch; composing={cho:-1,jung:-1,jong:0};}
function updateInputField(){const d=committed+getComposingChar(); document.getElementById('q').value=d||''; document.getElementById('statusText').textContent=d?`입력: ${d}`:'V24: 키보드에서 입력하세요';}
function isConsonant(j){return CHO.includes(j);}
function inputHangulClean(jamo){
  if(jamo===' '){commitComposing(); committed+=' '; updateInputField(); return;}
  const DC={'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'}; const DJC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'}; const DJOC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'}; const DJS={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  if(isConsonant(jamo)){
    const cIdx=choIdx(jamo);
    if(composing.cho<0&&composing.jung<0){composing.cho=cIdx;}
    else if(composing.cho>=0&&composing.jung<0){const prev=CHO[composing.cho]; const comb=DC[prev+jamo]; if(comb){composing.cho=choIdx(comb);} else {committed+=CHO[composing.cho]; composing.cho=cIdx;}}
    else if(composing.jung>=0&&composing.jong==0){const ji=jongIdx(jamo); if(ji>0){composing.jong=ji;} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
    else if(composing.jong>0){const prevJ=JONG[composing.jong]; const comb=DJOC[prevJ+jamo]; if(comb){composing.jong=jongIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,composing.jong); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
  } else {
    const vIdx=jungIdx(jamo);
    if(composing.cho<0){composing.cho=choIdx('ㅇ'); composing.jung=vIdx;}
    else if(composing.jung<0){composing.jung=vIdx;}
    else if(composing.jong==0){const prevV=JUNG[composing.jung]; const comb=DJC[prevV+jamo]; if(comb){composing.jung=jungIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:choIdx('ㅇ'),jung:vIdx,jong:0};}}
    else {const jongChar=JONG[composing.jong]; let rem=0; let nextC=jongChar; if(DJS[jongChar]){const p=DJS[jongChar]; rem=jongIdx(p[0]); nextC=p[1];} else {rem=0; nextC=jongChar;} const syl=makeSyllable(composing.cho,composing.jung,rem); committed+=syl; composing={cho:choIdx(nextC),jung:vIdx,jong:0};}
  }
  updateInputField();
}
function delKey(){if(getComposingChar()){if(composing.jong>0){composing.jong=0;} else if(composing.jung>=0){composing.jung=-1;} else if(composing.cho>=0){composing.cho=-1;}} else {if(committed.length>0) committed=committed.slice(0,-1);} updateInputField();}
function clearInput(){committed=''; composing={cho:-1,jung:-1,jong:0}; updateInputField();}
function typeKey(k){if(currentLang==='kr'){if(k===' ') inputHangulClean(' '); else inputHangulClean(k);} else {commitComposing(); committed+=k; updateInputField();} if(navigator.vibrate) navigator.vibrate(30);}
let currentLang='kr';
function setLang(lang){currentLang=lang; document.getElementById('tabKr').classList.toggle('active',lang==='kr'); document.getElementById('tabEn').classList.toggle('active',lang==='en'); buildKeypad(); setTimeout(()=>{const fk=document.querySelector('#keypad button'); if(fk) fk.focus();},100);}
function buildKeypad(){
  const kp=document.getElementById('keypad'); kp.innerHTML=''; kp.className='keypad '+currentLang;
  if(currentLang==='kr'){
    const rows=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']];
    rows.forEach(row=>{row.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.setAttribute('tabindex','0'); b.onclick=()=>{typeKey(k); b.focus();}; b.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); typeKey(k);}}; kp.appendChild(b);});});
    const space=document.createElement('button'); space.textContent='스페이스'; space.className='special'; space.style.gridColumn='span 4'; space.setAttribute('tabindex','0'); space.onclick=()=>{typeKey(' '); space.focus();}; kp.appendChild(space);
    const del=document.createElement('button'); del.textContent='⌫'; del.className='del'; del.style.gridColumn='span 3'; del.setAttribute('tabindex','0'); del.onclick=()=>{delKey(); del.focus();}; kp.appendChild(del);
    const enter=document.createElement('button'); enter.textContent='검색'; enter.className='search'; enter.style.gridColumn='span 3'; enter.setAttribute('tabindex','0'); enter.onclick=()=>{doSearch();}; kp.appendChild(enter);
  } else {
    const rows=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];
    rows.forEach(row=>{row.forEach(k=>{const b=document.createElement('button'); b.textContent=k; b.setAttribute('tabindex','0'); b.onclick=()=>{typeKey(k); b.focus();}; kp.appendChild(b);});});
    const space=document.createElement('button'); space.textContent='Space'; space.className='special'; space.style.gridColumn='span 4'; space.setAttribute('tabindex','0'); space.onclick=()=>{typeKey(' ');}; kp.appendChild(space);
    const del=document.createElement('button'); del.textContent='⌫'; del.className='del'; del.style.gridColumn='span 3'; del.setAttribute('tabindex','0'); del.onclick=()=>{delKey();}; kp.appendChild(del);
    const enter=document.createElement('button'); enter.textContent='Search'; enter.className='search'; enter.style.gridColumn='span 3'; enter.setAttribute('tabindex','0'); enter.onclick=()=>{doSearch();}; kp.appendChild(enter);
  }
}
function showKeypad(){document.getElementById('keypadWrap').classList.remove('hidden'); document.getElementById('kbBtn').classList.add('active'); setTimeout(()=>{const fk=document.querySelector('#keypad button'); if(fk) fk.focus();},150);}
function hideKeypad(){document.getElementById('keypadWrap').classList.add('hidden'); document.getElementById('kbBtn').classList.remove('active'); document.getElementById('searchBtn').focus();}
function toggleKeypad(){const w=document.getElementById('keypadWrap'); if(w.classList.contains('hidden')) showKeypad(); else hideKeypad();}
function setQuery(t){committed=t; composing={cho:-1,jung:-1,jong:0}; updateInputField(); doSearch();}

let lastItems=[], focusedIndex=0, currentPage=0, isPlayer=false;
const ITEMS_PER_PAGE=10;

async function fetchTimeout(url,ms=7000){const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); try{const r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) throw new Error(r.status); return await r.json();}catch(e){clearTimeout(t); throw e;}}
async function searchPiped(q){
  const INSTANCES=["https://pipedapi.kavin.rocks","https://api.piped.private.coffee","https://pipedapi.adminforge.de"];
  for(let i=0;i<INSTANCES.length;i++){
    document.getElementById('info').textContent=`${i+1}/${INSTANCES.length}`;
    try{const d=await fetchTimeout(`${INSTANCES[i]}/search?q=${encodeURIComponent(q)}&filter=videos`,8000); if(d.items&&d.items.length) return {items:d.items, host:new URL(INSTANCES[i]).host};}catch(e){continue;}
  }
  throw new Error('all failed');
}

function renderPage(){
  const list=document.getElementById('list'); list.innerHTML=''; document.getElementById('player').style.display='none'; document.getElementById('pagination').style.display='flex'; document.getElementById('quick').style.display='flex'; list.style.display='flex'; isPlayer=false; document.getElementById('hud').classList.remove('playing'); document.getElementById('playOverlay').classList.remove('show');
  const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); const start=currentPage*ITEMS_PER_PAGE; const end=Math.min(start+ITEMS_PER_PAGE,lastItems.length);
  for(let idx=start; idx<end; idx++){
    const v=lastItems[idx]; const id=v.url?.replace('/watch?v=','')||v.id||''; const title=v.title||'No title'; const ch=v.uploaderName||v.author||''; const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
    const btn=document.createElement('button'); btn.className='card-btn'; btn.id='card-'+idx; btn.setAttribute('tabindex','0');
    btn.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" loading="lazy"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
    btn.addEventListener('click', ()=>{ focusedIndex=idx; playVideo(id); });
    btn.addEventListener('focus', ()=>{ focusedIndex=idx; });
    list.appendChild(btn);
  }
  document.getElementById('pageInfo').textContent=`${currentPage+1}/${totalPages}`; document.getElementById('count').textContent=`${lastItems.length}개`; document.getElementById('statusText').textContent=`V24 V12모드 - ${lastItems.length}개 중 ${start+1}-${end}`;
  document.getElementById('prevBtn').disabled=currentPage===0; document.getElementById('nextBtn').disabled=currentPage>=totalPages-1;
  setTimeout(()=>{ const f=document.getElementById('card-'+start); if(f) f.focus(); },100);
}
function changePage(dir){const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); let np=currentPage+dir; if(np<0) np=0; if(np>=totalPages) np=totalPages-1; if(np===currentPage) return; currentPage=np; focusedIndex=currentPage*ITEMS_PER_PAGE; renderPage();}

function playVideo(id){
  // V12처럼 바로 유튜브만!
  const list=document.getElementById('list'); list.style.display='none';
  document.getElementById('pagination').style.display='none';
  document.getElementById('quick').style.display='none';
  hideKeypad();
  const player=document.getElementById('player');
  player.style.display='flex';
  player.innerHTML=`<iframe id="ytFrame" src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&fs=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  isPlayer=true;
  document.getElementById('hud').classList.add('playing');
  // 오버레이 힌트
  const overlay=document.getElementById('playOverlay');
  overlay.classList.remove('show');
  document.getElementById('playHint').classList.remove('hide');
  setTimeout(()=>{ document.getElementById('playHint').classList.add('hide'); },2500);
  document.getElementById('statusText').textContent='V24 V12처럼 유튜브만 600x600 - 탭하면 버튼 / Esc=목록';
}

function backToList(){
  document.getElementById('player').style.display='none';
  document.getElementById('list').style.display='flex';
  document.getElementById('pagination').style.display='flex';
  document.getElementById('quick').style.display='flex';
  isPlayer=false;
  document.getElementById('hud').classList.remove('playing');
  document.getElementById('playOverlay').classList.remove('show');
  renderPage();
}
function nextVideo(dir){if(!lastItems.length) return; let ni=focusedIndex+dir; if(ni<0) ni=lastItems.length-1; if(ni>=lastItems.length) ni=0; focusedIndex=ni; currentPage=Math.floor(ni/ITEMS_PER_PAGE); const v=lastItems[ni]; const id=v.url?.replace('/watch?v=','')||v.id; playVideo(id);}
function toggleOverlay(){
  const overlay=document.getElementById('playOverlay');
  overlay.classList.toggle('show');
  if(overlay.classList.contains('show')){
    setTimeout(()=>{ overlay.classList.remove('show'); },4000);
  }
}

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(isPlayer){ backToList(); return; }
    if(!document.getElementById('keypadWrap').classList.contains('hidden')){ hideKeypad(); return; }
  }
  if(isPlayer && (e.key==='ArrowRight' || e.key==='PageDown')){ nextVideo(1); e.preventDefault(); }
  if(isPlayer && (e.key==='ArrowLeft' || e.key==='PageUp')){ nextVideo(-1); e.preventDefault(); }
});

async function doSearch(){
  commitComposing();
  const q=document.getElementById('q').value.trim()||'고양이';
  hideKeypad();
  document.getElementById('statusText').textContent='V24 검색: '+q;
  document.getElementById('list').innerHTML='<div class="center"><b>V24 검색 중...</b><br>'+q+'</div>';
  document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex';
  try{
    const res=await searchPiped(q);
    lastItems=res.items.slice(0,20);
    focusedIndex=0; currentPage=0;
    document.getElementById('info').textContent=res.host+' ✓ V24 V12모드';
    renderPage();
  }catch(e){
    document.getElementById('list').innerHTML=`<div class="center"><b>검색 실패</b><br><button tabindex="0" onclick="doSearch()" style="background:#00ff88;color:#000;border:0;padding:10px 20px;border-radius:10px;font-weight:900">재시도</button></div>`;
  }
}

buildKeypad(); showKeypad();
setTimeout(()=>{ committed='고양이'; updateInputField(); doSearch(); }, 500);
</script>
</body>
