<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ray-Ban KR Keyboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:2px solid #222}
.header{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.logo{font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;background:#00ff88;color:#000;padding:2px 6px;border-radius:4px;font-weight:800}
.search-row{display:flex;gap:6px;padding:8px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#0a0a0a;border:1px solid #444;border-radius:10px;padding:14px 12px;color:#fff;font-size:20px;outline:none}
.search-row input:focus{border-color:#00ff88}
.search-row button{background:#fff;color:#000;border:0;border-radius:10px;padding:0 16px;font-weight:900;font-size:15px;min-width:74px}
.status{height:26px;padding:0 12px;font-size:11px;color:#00ff88;display:flex;align-items:center;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}
.list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.card{display:flex;gap:8px;background:#1e1e1e;border-radius:12px;padding:8px;cursor:pointer;border:2px solid transparent;min-height:86px;align-items:center}
.card:active{border-color:#00ff88;background:#2a2a2a;transform:scale(0.98)}
.card.selected{border-color:#00ff88;background:#242424}
.thumb{width:120px;height:68px;border-radius:8px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:14px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:11px;color:#aaa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{background:#2a2a2a;color:#00ff88;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
.player{flex:1;display:flex;flex-direction:column;background:#000}
.player iframe{flex:1;width:100%;border:0}
.controls{display:flex;gap:6px;padding:8px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.ctrl{flex:1;background:#2a2a2a;border:0;color:#fff;padding:14px 4px;border-radius:12px;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.ctrl.big{flex:1.3;background:#fff;color:#000;font-size:15px}
.ctrl:active{transform:scale(0.96)}
.scroll-ctrls{display:flex;gap:6px;padding:6px;background:#0f0f0f;border-top:1px solid #222;flex-shrink:0}
.scroll-ctrls button{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:16px;border-radius:12px;font-weight:900;font-size:18px}
.scroll-ctrls button:active{background:#2a2a2a;border-color:#00ff88}
.keypad-wrap{display:flex;flex-direction:column;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0}
.keypad-tabs{display:flex;gap:4px;padding:6px 6px 0 6px}
.keypad-tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#888;font-size:12px;font-weight:800}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad{display:grid;gap:3px;padding:6px}
.keypad.kr{grid-template-columns:repeat(10,1fr)}
.keypad.en{grid-template-columns:repeat(10,1fr)}
.keypad button{background:#1e1e1e;border:0;color:#fff;padding:12px 2px;border-radius:8px;font-size:15px;font-weight:700;min-height:44px}
.keypad button:active{background:#00ff88;color:#000}
.keypad .space{grid-column:span 4;background:#2a2a2a}
.keypad .del{grid-column:span 2;background:#ff3b30;color:#fff}
.keypad .enter{grid-column:span 2;background:#00ff88;color:#000}
.keypad .shift{grid-column:span 2;background:#333;color:#00ff88}
.footer{height:20px;padding:0 10px;background:#000;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#555;flex-shrink:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#777;padding:20px;text-align:center}
.center b{color:#fff;font-size:16px}
</style>
</head>
<body>
<div class="hud">
  <div class="header">
    <div class="logo"><span style="width:26px;height:26px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px">RB</span> Ray-Ban <span class="badge">KR</span></div>
    <div style="font-size:11px;color:#00ff88;font-weight:800">한글 키보드 탑재</div>
  </div>
  <div class="search-row">
    <input id="q" placeholder="한글로 검색 - 예: 고양이" value="">
    <button onclick="doSearch()">검색</button>
  </div>
  <div id="status" class="status">한/영 전환 → 글자 눌러서 입력 → 검색</div>
  <div class="content">
    <div id="list" class="list"></div>
    <div id="player" class="player" style="display:none"></div>
  </div>
  <div id="scrollCtrl" class="scroll-ctrls">
    <button onclick="scrollList(-200)">▲ 위</button>
    <button onclick="scrollList(200)">▼ 아래</button>
    <button onclick="toggleKeypad()">⌨️ 키보드</button>
  </div>
  <div id="keypadWrap" class="keypad-wrap">
    <div class="keypad-tabs">
      <button id="tabKr" class="active" onclick="setLang('kr')">한글</button>
      <button id="tabEn" onclick="setLang('en')">ENG</button>
      <button onclick="clearInput()">지우기</button>
      <button onclick="delKey()" style="background:#ff3b30;color:#fff">⌫</button>
    </div>
    <div id="keypad" class="keypad kr"></div>
  </div>
  <div class="footer"><span>KR KEYBOARD • 600×600 HUD • 쌍자음 더블탭</span><span id="info">ready</span></div>
</div>

<script>
const INSTANCES = [
  "https://pipedapi.kavin.rocks",
  "https://api.piped.private.coffee",
  "https://pipedapi.adminforge.de",
  "https://pipedapi.in.projectsegfau.lt",
  "https://pipedapi.syncpundi.com",
  "https://pipedapi.drgns.space",
  "https://pipedapi.leptosinfra.com",
  "https://api.piped.privacydev.net"
];

// Hangul composition engine
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

const JONG_TO_CHO = { 'ㄱ':0,'ㄲ':1,'ㄴ':2,'ㄷ':3,'ㄹ':5,'ㅁ':6,'ㅂ':7,'ㅅ':9,'ㅆ':10,'ㅇ':11,'ㅈ':12,'ㅊ':14,'ㅋ':15,'ㅌ':16,'ㅍ':17,'ㅎ':18 };

const DOUBLE_JONG_SPLIT = {
  'ㄳ': ['ㄱ','ㅅ'], 'ㄵ': ['ㄴ','ㅈ'], 'ㄶ': ['ㄴ','ㅎ'],
  'ㄺ': ['ㄹ','ㄱ'], 'ㄻ': ['ㄹ','ㅁ'], 'ㄼ': ['ㄹ','ㅂ'],
  'ㄽ': ['ㄹ','ㅅ'], 'ㄾ': ['ㄹ','ㅌ'], 'ㄿ': ['ㄹ','ㅍ'],
  'ㅀ': ['ㄹ','ㅎ'], 'ㅄ': ['ㅂ','ㅅ']
};
const DOUBLE_JONG_COMBINE = {
  'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'
};
const DOUBLE_JUNG_COMBINE = {
  'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'
};
const DOUBLE_CHO_COMBINE = { 'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ' };

function isConsonant(j){ return CHO.includes(j); }
function isVowel(j){ return ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'].includes(j); }

let committed = '';
let composing = { cho:-1, jung:-1, jong:0 };

function choIdx(c){ return CHO.indexOf(c); }
function jungIdx(j){ return JUNG.indexOf(j); }
function jongIdx(j){ return JONG.indexOf(j); }

function makeSyllable(cho, jung, jong){
  if(cho<0 || jung<0) return null;
  return String.fromCharCode(0xAC00 + cho*21*28 + jung*28 + jong);
}

function getComposingChar(){
  if(composing.cho>=0 && composing.jung>=0){
    return makeSyllable(composing.cho, composing.jung, composing.jong);
  }
  if(composing.cho>=0 && composing.jung<0){
    return CHO[composing.cho];
  }
  if(composing.cho<0 && composing.jung>=0){
    return JUNG[composing.jung];
  }
  return '';
}

function commitComposing(){
  const ch = getComposingChar();
  if(ch) committed += ch;
  composing = { cho:-1, jung:-1, jong:0 };
}

function updateInputField(){
  const inp = document.getElementById('q');
  inp.value = committed + getComposingChar();
}

function inputHangul(jamo){
  // jamo is one compatibility jamo like 'ㄱ' or 'ㅏ'
  if(!isConsonant(jamo) && !isVowel(jamo)){
    // other char like space
    commitComposing();
    committed += jamo;
    updateInputField();
    return;
  }

  // consonant
  if(isConsonant(jamo)){
    const cIdx = choIdx(jamo);
    if(composing.cho<0 && composing.jung<0){
      // start new
      composing.cho = cIdx;
    } else if(composing.cho>=0 && composing.jung<0){
      // cho + cho -> double cho?
      const prevChoChar = CHO[composing.cho];
      const combined = DOUBLE_CHO_COMBINE[prevChoChar + jamo];
      if(combined){
        composing.cho = choIdx(combined);
      } else {
        // commit prev as isolated
        committed += CHO[composing.cho];
        composing.cho = cIdx;
      }
    } else if(composing.cho>=0 && composing.jung>=0 && composing.jong==0){
      // cho+jung + consonant -> jong
      composing.jong = jongIdx(jamo);
      if(composing.jong<0) composing.jong = 0; // if not valid jong, treat as new
      // if jong conversion fails (e.g., ㄸ not valid as jong), move to next syllable
      if(jongIdx(jamo)==-1){
        // invalid jong, commit and start new
        const syl = makeSyllable(composing.cho, composing.jung, 0);
        committed += syl;
        composing = { cho:cIdx, jung:-1, jong:0 };
      }
    } else if(composing.jong>0){
      // has jong, try double jong
      const prevJongChar = JONG[composing.jong];
      const combined = DOUBLE_JONG_COMBINE[prevJongChar + jamo];
      if(combined){
        composing.jong = jongIdx(combined);
      } else {
        // commit current and start new
        const syl = makeSyllable(composing.cho, composing.jung, composing.jong);
        committed += syl;
        composing = { cho:cIdx, jung:-1, jong:0 };
      }
    }
  } else if(isVowel(jamo)){
    // vowel
    if(composing.cho<0){
      // no cho, assume ㅇ
      composing.cho = choIdx('ㅇ');
      composing.jung = jungIdx(jamo);
    } else if(composing.jung<0){
      composing.jung = jungIdx(jamo);
    } else if(composing.jong==0){
      // try double jung
      const prevJungChar = JUNG[composing.jung];
      const combined = DOUBLE_JUNG_COMBINE[prevJungChar + jamo];
      if(combined){
        composing.jung = jungIdx(combined);
      } else {
        // commit and start new with ㅇ
        const syl = makeSyllable(composing.cho, composing.jung, 0);
        committed += syl;
        composing = { cho:choIdx('ㅇ'), jung:jungIdx(jamo), jong:0 };
      }
    } else {
      // has jong, need to split jong to next syllable
      let jongChar = JONG[composing.jong];
      let nextChoChar = jamo; // placeholder, will be replaced
      // Actually we need to move jong to next cho
      if(DOUBLE_JONG_SPLIT[jongChar]){
        const parts = DOUBLE_JONG_SPLIT[jongChar];
        const first = parts[0];
        const second = parts[1];
        // first remains as jong
        composing.jong = jongIdx(first);
        const syl = makeSyllable(composing.cho, composing.jung, composing.jong);
        committed += syl;
        // second becomes cho of next
        composing = { cho:choIdx(second), jung:jungIdx(jamo), jong:0 };
      } else {
        // single jong moves to next cho
        const syl = makeSyllable(composing.cho, composing.jung, 0);
        // Wait we need to keep jong? Actually move jong to next cho, so current becomes without jong
        committed += syl;
        composing = { cho:JONG_TO_CHO[jongChar]!==undefined ? JONG_TO_CHO[jongChar] : choIdx(jongChar), jung:jungIdx(jamo), jong:0 };
        // correction: we committed without jong, but we should have committed without jong? Let's do proper:
        // committed should be previous syllable without jong, and jong becomes cho
        // So revert:
        committed = committed.slice(0,-1);
        const withoutJong = makeSyllable(composing.cho>=0?composing.cho:0, composing.jung, 0); // messy
        // Simpler: recompute
        // Let's redo logic clean:
        const prevCho = composing.cho;
        const prevJung = composing.jung;
        const sylWithoutJong = makeSyllable(prevCho, prevJung, 0);
        committed = committed.slice(0,-1) + sylWithoutJong; // we already added with jong? Actually we added above, need to fix
        // To avoid complexity, just commit without jong and move
        // For now, correct by:
        // We'll have committed already has sylWithoutJong, and new composing has cho=jong
      }
      // The above branch got messy, let's implement clean version:
      // Re-implement vowel with jong present:
      // We will redo this case separately below with clean logic
    }
  }
  updateInputField();
}

// Cleaner vowel-with-jong handling override
function inputHangulClean(jamo){
  if(jamo===' '){ commitComposing(); committed+=' '; updateInputField(); return; }
  if(!isConsonant(jamo) && !isVowel(jamo)){ commitComposing(); committed+=jamo; updateInputField(); return; }

  if(isConsonant(jamo)){
    const cIdx = choIdx(jamo);
    if(composing.cho<0 && composing.jung<0){
      composing.cho=cIdx;
    } else if(composing.cho>=0 && composing.jung<0){
      const prev = CHO[composing.cho];
      const comb = DOUBLE_CHO_COMBINE[prev+jamo];
      if(comb){ composing.cho=choIdx(comb); }
      else { committed+=CHO[composing.cho]; composing.cho=cIdx; }
    } else if(composing.jung>=0 && composing.jong==0){
      const ji = jongIdx(jamo);
      if(ji>0){ composing.jong=ji; } else {
        const syl=makeSyllable(composing.cho, composing.jung, 0);
        committed+=syl;
        composing={cho:cIdx, jung:-1, jong:0};
      }
    } else if(composing.jong>0){
      const prevJ = JONG[composing.jong];
      const comb = DOUBLE_JONG_COMBINE[prevJ+jamo];
      if(comb){ composing.jong=jongIdx(comb); }
      else {
        const syl=makeSyllable(composing.cho, composing.jung, composing.jong);
        committed+=syl;
        composing={cho:cIdx, jung:-1, jong:0};
      }
    }
  } else {
    // vowel
    const vIdx = jungIdx(jamo);
    if(composing.cho<0){
      composing.cho=choIdx('ㅇ'); composing.jung=vIdx;
    } else if(composing.jung<0){
      composing.jung=vIdx;
    } else if(composing.jong==0){
      const prevV = JUNG[composing.jung];
      const comb = DOUBLE_JUNG_COMBINE[prevV+jamo];
      if(comb){ composing.jung=jungIdx(comb); }
      else {
        const syl=makeSyllable(composing.cho, composing.jung, 0);
        committed+=syl;
        composing={cho:choIdx('ㅇ'), jung:vIdx, jong:0};
      }
    } else {
      // has jong -> split
      const jongChar = JONG[composing.jong];
      let remainingJong = 0;
      let nextChoChar = jongChar;
      if(DOUBLE_JONG_SPLIT[jongChar]){
        const parts = DOUBLE_JONG_SPLIT[jongChar];
        remainingJong = jongIdx(parts[0]);
        nextChoChar = parts[1];
      } else {
        remainingJong = 0;
        nextChoChar = jongChar;
      }
      const syl = makeSyllable(composing.cho, composing.jung, remainingJong);
      committed+=syl;
      composing={cho:choIdx(nextChoChar), jung:vIdx, jong:0};
    }
  }
  updateInputField();
}

function delKey(){
  if(getComposingChar()){
    // delete from composing
    if(composing.jong>0){
      const jc = JONG[composing.jong];
      if(DOUBLE_JONG_SPLIT[jc]){
        // split back to first part
        const first = DOUBLE_JONG_SPLIT[jc][0];
        composing.jong = jongIdx(first);
      } else {
        composing.jong = 0;
      }
    } else if(composing.jung>=0){
      // check if jung is double
      const jChar = JUNG[composing.jung];
      // reverse double jung
      let found=false;
      for(const [k,v] of Object.entries(DOUBLE_JUNG_COMBINE)){
        if(v===jChar){ composing.jung = jungIdx(k[0]); found=true; break; }
      }
      if(!found) composing.jung=-1;
      if(composing.jung<0 && composing.cho>=0){
        // keep cho
      }
    } else if(composing.cho>=0){
      const cChar = CHO[composing.cho];
      let found=false;
      for(const [k,v] of Object.entries(DOUBLE_CHO_COMBINE)){
        if(v===cChar){ composing.cho = choIdx(k[0]); found=true; break; }
      }
      if(!found) composing.cho=-1;
    }
  } else {
    if(committed.length>0){
      committed = committed.slice(0,-1);
    }
  }
  updateInputField();
}

function clearInput(){ committed=''; composing={cho:-1,jung:-1,jong:0}; updateInputField(); }

function typeKey(k){
  if(currentLang==='kr'){
    if(k===' '){ inputHangulClean(' '); return; }
    inputHangulClean(k);
  } else {
    commitComposing();
    committed+=k;
    updateInputField();
  }
}

// Keyboard UI
let currentLang='kr';
function setLang(lang){
  currentLang=lang;
  document.getElementById('tabKr').classList.toggle('active', lang==='kr');
  document.getElementById('tabEn').classList.toggle('active', lang==='en');
  buildKeypad();
}

function buildKeypad(){
  const kp=document.getElementById('keypad');
  kp.innerHTML='';
  kp.className='keypad '+currentLang;
  if(currentLang==='kr'){
    const rows = [
      ['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],
      ['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],
      ['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','DEL',' ']
    ];
    rows.forEach(row=>{
      row.forEach(k=>{
        const b=document.createElement('button');
        if(k===' '){ b.textContent='스페이스'; b.className='space'; b.style.gridColumn='span 3'; b.onclick=()=>typeKey(' '); }
        else if(k==='DEL'){ b.textContent='⌫'; b.className='del'; b.onclick=()=>delKey(); }
        else { b.textContent=k; b.onclick=()=>typeKey(k); }
        kp.appendChild(b);
      });
    });
    const enter=document.createElement('button');
    enter.textContent='검색'; enter.className='enter'; enter.style.gridColumn='span 2'; enter.onclick=()=>doSearch();
    kp.appendChild(enter);
    // 쌍자음 hint
    const hint=document.createElement('button');
    hint.textContent='ㄲ'; hint.title='더블탭으로 쌍자음'; hint.onclick=()=>typeKey('ㄱ');
    hint.style.background='#222'; hint.style.fontSize='11px';
    // we keep simple
  } else {
    const rows = [
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l'],
      ['z','x','c','v','b','n','m','DEL',' ']
    ];
    rows.forEach(row=>{
      row.forEach(k=>{
        const b=document.createElement('button');
        if(k===' '){ b.textContent='Space'; b.className='space'; b.style.gridColumn='span 3'; b.onclick=()=>typeKey(' '); }
        else if(k==='DEL'){ b.textContent='⌫'; b.className='del'; b.onclick=()=>delKey(); }
        else { b.textContent=k; b.onclick=()=>typeKey(k); }
        kp.appendChild(b);
      });
    });
    const enter=document.createElement('button');
    enter.textContent='Search'; enter.className='enter'; enter.style.gridColumn='span 2'; enter.onclick=()=>doSearch();
    kp.appendChild(enter);
  }
}

// Search logic (same as before)
let lastItems=[], lastQuery='', selectedIndex=-1, isPlayer=false;
async function fetchTimeout(url, ms=6500){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{ const r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) throw new Error(r.status); return await r.json(); }catch(e){ clearTimeout(t); throw e; }
}
async function searchPiped(q){
  for(let i=0;i<INSTANCES.length;i++){
    document.getElementById('info').textContent=`${i+1}/${INSTANCES.length} ${new URL(INSTANCES[i]).host}`;
    try{
      const d=await fetchTimeout(`${INSTANCES[i]}/search?q=${encodeURIComponent(q)}&filter=videos`,7000);
      if(d.items && d.items.length) return {items:d.items, host:new URL(INSTANCES[i]).host};
    }catch(e){ continue; }
  }
  throw new Error('all failed');
}
function renderList(items){
  const list=document.getElementById('list');
  list.innerHTML='';
  document.getElementById('player').style.display='none';
  list.style.display='flex';
  document.getElementById('scrollCtrl').style.display='flex';
  isPlayer=false;
  items.forEach((v, idx)=>{
    const id=v.url?.replace('/watch?v=','')||v.id||'';
    const title=v.title||'No title';
    const ch=v.uploaderName||v.author||'';
    const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
    const div=document.createElement('div');
    div.className='card';
    div.id='card-'+idx;
    div.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" onerror="this.src='https://i.ytimg.com/vi/${id}/mqdefault.jpg'"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
    div.onclick=()=>playVideo(id, title, idx);
    list.appendChild(div);
  });
}
function playVideo(id, title, idx){
  selectedIndex=idx;
  const list=document.getElementById('list');
  list.style.display='none';
  document.getElementById('scrollCtrl').style.display='none';
  const player=document.getElementById('player');
  player.style.display='flex';
  isPlayer=true;
  player.innerHTML=`
    <div class="controls">
      <button class="ctrl" onclick="backToList()"><span>←</span>목록</button>
      <button class="ctrl big" onclick="toggleFullscreen()">⛶ 크게</button>
      <button class="ctrl" onclick="nextVideo(1)"><span>→</span>다음</button>
    </div>
    <iframe id="yt" src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&enablejsapi=1&origin=https://k9h9s9999-coder.github.io" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <div class="controls">
      <button class="ctrl" onclick="nextVideo(-1)">이전</button>
      <button class="ctrl big" onclick="backToList()">✕ 닫기</button>
      <button class="ctrl" onclick="copyLink('${id}')">복사</button>
    </div>
  `;
  document.getElementById('status').textContent=`${idx+1} / ${lastItems.length} - ${title.slice(0,30)}`;
}
function backToList(){
  document.getElementById('player').style.display='none';
  document.getElementById('list').style.display='flex';
  document.getElementById('scrollCtrl').style.display='flex';
  isPlayer=false;
}
function nextVideo(dir){
  if(!lastItems.length) return;
  let ni = selectedIndex+dir;
  if(ni<0) ni=lastItems.length-1;
  if(ni>=lastItems.length) ni=0;
  const v=lastItems[ni];
  const id=v.url?.replace('/watch?v=','')||v.id;
  playVideo(id, v.title, ni);
}
function scrollList(px){ document.getElementById('list').scrollBy({top:px, behavior:'smooth'}); }
function toggleKeypad(){
  const w=document.getElementById('keypadWrap');
  w.style.display = w.style.display==='none' ? 'flex' : 'none';
}
function copyLink(id){ navigator.clipboard.writeText('https://youtu.be/'+id); document.getElementById('status').textContent='링크 복사됨!'; }
function toggleFullscreen(){ const f=document.getElementById('yt'); if(f) f.requestFullscreen?.(); }

async function doSearch(){
  commitComposing();
  const q=document.getElementById('q').value.trim()||'고양이';
  lastQuery=q;
  document.getElementById('status').textContent='검색 중...';
  document.getElementById('list').innerHTML='<div class="center"><b>검색 중...</b>서버 순회</div>';
  document.getElementById('player').style.display='none';
  document.getElementById('list').style.display='flex';
  try{
    const res=await searchPiped(q);
    lastItems=res.items.slice(0,20);
    document.getElementById('status').textContent=`${q} - ${lastItems.length}개 (${res.host})`;
    document.getElementById('info').textContent=res.host+' ✓';
    renderList(lastItems);
  }catch(e){
    document.getElementById('status').textContent='Piped 실패 - 직접 검색 전환';
    const p=document.getElementById('player');
    p.style.display='flex';
    document.getElementById('list').style.display='none';
    p.innerHTML=`<div class="controls"><button class="ctrl" onclick="backToList()">← 목록</button><button class="ctrl big" onclick="doSearch()">재시도</button></div><iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}" allow="encrypted-media; fullscreen"></iframe>`;
  }
}

buildKeypad();
setTimeout(()=>{ document.getElementById('q').value='고양이'; doSearch(); }, 600);
</script>
