<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V31 Keyboard On Demand</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:3px solid #00ff88}
.hud.playing{border-radius:0;border:0;background:#000}
.hud.playing .header, .hud.playing .search-row, .hud.playing .status, .hud.playing .footer, .hud.playing .pagination, .hud.playing .keypad-wrap{display:none !important}
.hud.playing .content{flex:1;height:600px;background:#000}
.hud.playing .player{height:600px;width:600px;background:#000;display:flex !important}
.hud.playing .player iframe{height:600px !important;width:600px !important;border:0}
.header{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;font-size:12px}
.search-row{display:flex;gap:4px;padding:6px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#000;border:2px solid #00ff88;border-radius:10px;padding:12px 10px;color:#fff;font-size:16px;outline:none;min-width:0}
.search-row input.focused{box-shadow:0 0 0 4px rgba(0,255,136,.6);border-color:#00ff88;transform:scale(1.02)}
.search-row button{background:#00ff88;color:#000;border:2px solid #00ff88;border-radius:10px;padding:0 12px;font-weight:900;font-size:14px;min-width:60px;height:46px;outline:none;flex-shrink:0}
.search-row button.focused{transform:scale(1.1);box-shadow:0 0 0 4px rgba(0,255,136,.7)}
.search-row button.kb{background:#1e1e1e;color:#00ff88;border:2px solid #00ff88;min-width:88px;font-size:13px}
.search-row button.kb.active{background:#00ff88;color:#000;border-color:#00ff88}
.status{height:18px;padding:0 10px;font-size:9px;color:#00ff88;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#121212;min-height:0}
.list{flex:1;overflow:hidden;padding:4px 6px;display:flex;flex-direction:column;gap:4px}
.card-btn{display:flex;gap:6px;align-items:center;background:#1e1e1e;border:2px solid transparent;border-radius:10px;padding:6px;width:100%;text-align:left;min-height:52px;outline:none;color:#fff;transition:all .1s}
.card-btn.focused{border-color:#00ff88 !important;background:#2a2a2a !important;transform:scale(1.03);box-shadow:0 0 0 4px rgba(0,255,136,.6)}
.thumb{width:80px;height:44px;border-radius:6px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:11px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:8px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{background:#2a2a2a;color:#00ff88;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex-shrink:0}
.player{flex:1;display:none;flex-direction:column;background:#000;position:relative}
.player iframe{flex:1;width:100%;border:0;background:#000}
.pagination{height:38px;display:flex;gap:6px;padding:4px 6px;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0}
.page-btn{flex:1;background:#1e1e1e;border:2px solid #333;color:#fff;border-radius:8px;font-size:11px;font-weight:800;outline:none;height:32px}
.page-btn.focused{background:#00ff88 !important;color:#000 !important;border-color:#00ff88 !important;transform:scale(1.05);box-shadow:0 0 0 3px rgba(0,255,136,.5)}
.footer{height:10px;padding:0 8px;background:#000;display:flex;justify-content:space-between;font-size:7px;color:#444;flex-shrink:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#666;padding:20px;text-align:center}
.version{position:absolute;top:1px;right:2px;background:#00ff88;color:#000;font-size:7px;font-weight:900;padding:2px 5px;border-radius:4px;z-index:99}
.keypad-wrap{display:flex;flex-direction:column;background:#000;border-top:3px solid #00ff88;flex-shrink:0;height:260px;overflow:hidden}
.keypad-wrap.hidden{display:none !important}
.keypad-tabs{display:flex;gap:4px;padding:6px;background:#111;flex-shrink:0}
.keypad-tabs button{flex:1;padding:10px;border-radius:8px;border:2px solid #333;background:#1e1e1e;color:#888;font-size:11px;font-weight:800;outline:none;min-height:36px}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad-tabs button.focused{background:#00ff88 !important;color:#000 !important;border-color:#00ff88 !important;transform:scale(1.08);box-shadow:0 0 0 3px #00ff88}
.keypad{display:grid;gap:5px;padding:8px;flex:1;overflow-y:auto;align-content:start;background:#000}
.keypad.kr{grid-template-columns:repeat(10,1fr)}
.keypad button{background:#222;border:2px solid #444;color:#fff;border-radius:10px;font-size:15px;font-weight:700;min-height:46px;outline:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.keypad button.focused{border-color:#00ff88 !important;background:#00ff88 !important;color:#000 !important;transform:scale(1.2) !important;box-shadow:0 0 0 4px rgba(0,255,136,.8) !important;z-index:20}
.keypad button.del{background:#331111;color:#ff5555;border-color:#ff3333}
.keypad button.search{background:#00ff88;color:#000;border-color:#00ff88;font-weight:900}
.keypad button.space{background:#111;color:#00ff88;border-color:#00ff88;grid-column:span 4}
</style>
</head>
<body>
<div class="hud" id="hud">
<div class="version">V31 누르면 나옴</div>
<div class="header"><div>RB YouTube <span style="font-size:8px;background:#00ff88;color:#000;padding:2px 4px;border-radius:3px">V31 누르면 키보드</span></div><div style="font-size:9px;color:#00ff88" id="pageInfo"></div></div>
<div class="search-row">
<input id="q" type="text" readonly placeholder="⌨️ 누르면 키보드 나옴">
<button id="kbBtn" class="kb" tabindex="0">⌨️ 키보드</button>
<button id="searchBtn" tabindex="0">검색</button>
</div>
<div class="status"><span id="statusText">V31: ⌨️ 누르면 키보드 나옴 / 처음엔 숨김</span><span id="info"></span></div>
<div class="content" id="content"><div id="list" class="list"></div><div id="player" class="player"></div></div>
<div class="pagination" id="pagination">
<button class="page-btn" id="prevBtn" tabindex="0">◀ 이전</button>
<button class="page-btn" id="nextBtn" tabindex="0">다음 ▶</button>
</div>
<div id="keypadWrap" class="keypad-wrap hidden">
<div class="keypad-tabs">
<button id="tabKr" class="active" tabindex="0">한글</button>
<button id="tabEn" tabindex="0">ENG</button>
<button id="btnClear" tabindex="0">지우기</button>
<button id="btnHide" tabindex="0">닫기</button>
</div>
<div id="keypad" class="keypad kr"></div>
</div>
<div class="footer"><span>V31 누르면 키보드 나옴 / 유튜브 원본 UI</span><span id="count"></span></div>
</div>
<script>
console.log('V31 Keyboard On Demand - Hidden by default');
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choIdx(c){return CHO.indexOf(c);} function jungIdx(j){return JUNG.indexOf(j);} function jongIdx(j){return JONG.indexOf(j);}
function makeSyllable(cho,jung,jong){if(cho<0||jung<0) return null; return String.fromCharCode(0xAC00+cho*21*28+jung*28+jong);}
let committed=''; let composing={cho:-1,jung:-1,jong:0};
function getComposingChar(){if(composing.cho>=0&&composing.jung>=0){return makeSyllable(composing.cho,composing.jung,composing.jong);} if(composing.cho>=0&&composing.jung<0){return CHO[composing.cho];} if(composing.cho<0&&composing.jung>=0){return JUNG[composing.jung];} return '';}
function commitComposing(){const ch=getComposingChar(); if(ch) committed+=ch; composing={cho:-1,jung:-1,jong:0};}
function updateInputField(){const d=committed+getComposingChar(); document.getElementById('q').value=d; document.getElementById('statusText').textContent=d?`입력: ${d} - ⌨️로 닫기`:`V31: ⌨️ 누르면 키보드 나옴 / 처음엔 숨김`;}
function isConsonant(j){return CHO.includes(j);}
function inputHangulClean(jamo){
  if(jamo===' '){commitComposing(); committed+=' '; updateInputField(); return;}
  const DC={'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'}; const DJC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'}; const DJOC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'}; const DJS={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  if(isConsonant(jamo)){
    const cIdx=choIdx(jamo);
    if(composing.cho<0&&composing.jung<0){composing.cho=cIdx;}
    else if(composing.cho>=0&&composing.jung<0){const prev=CHO[composing.cho]; const comb=DC[prev+jamo]; if(comb){composing.cho=choIdx(comb);} else {committed+=CHO[composing.cho]; composing.cho=cIdx;}}
    else if(composing.jung>=0&&composing.jong==0){const ji=jongIdx(jamo); if(ji>0){composing.jong=ji;} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
    else if(composing.jong>0){const prevJ=JONG[composing.jong]; const comb=DJOC[prevJ+jamo]; if(comb){composing.jong=jongIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,composing.jong); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
  } else {
    const vIdx=jungIdx(jamo);
    if(composing.cho<0){composing.cho=choIdx('ㅇ'); composing.jung=vIdx;}
    else if(composing.jung<0){composing.jung=vIdx;}
    else if(composing.jong==0){const prevV=JUNG[composing.jung]; const comb=DJC[prevV+jamo]; if(comb){composing.jung=jungIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:choIdx('ㅇ'),jung:vIdx,jong:0};}}
    else {const jongChar=JONG[composing.jong]; let rem=0; let nextC=jongChar; if(DJS[jongChar]){const p=DJS[jongChar]; rem=jongIdx(p[0]); nextC=p[1];} else {rem=0; nextC=jongChar;} const syl=makeSyllable(composing.cho,composing.jung,rem); committed+=syl; composing={cho:choIdx(nextC),jung:vIdx,jong:0};}
  }
  updateInputField();
}
function delKey(){if(getComposingChar()){if(composing.jong>0){composing.jong=0;} else if(composing.jung>=0){composing.jung=-1;} else if(composing.cho>=0){composing.cho=-1;}} else {if(committed.length>0) committed=committed.slice(0,-1);} updateInputField();}
function clearInput(){committed=''; composing={cho:-1,jung:-1,jong:0}; updateInputField();}
function typeKey(k){if(currentLang==='kr'){if(k===' ') inputHangulClean(' '); else inputHangulClean(k);} else {commitComposing(); committed+=k; updateInputField();} if(navigator.vibrate) navigator.vibrate(25);}

let currentLang='kr';
let focusIndex=0;
let allFocusable=[];
let kbButtons=[];
let kbFocusedIndex=0;
let inKeyboardMode=false;

function setLang(lang){
  currentLang=lang;
  document.getElementById('tabKr').classList.toggle('active',lang==='kr');
  document.getElementById('tabEn').classList.toggle('active',lang==='en');
  buildKeypad();
  rebuildFocusable();
  focusToKb(0);
}

function buildKeypad(){
  const kp=document.getElementById('keypad');
  kp.innerHTML='';
  kp.className='keypad '+currentLang;
  kbButtons=[];
  kbFocusedIndex=0;
  const createKbBtn=(label, cls, onClick)=>{
    const b=document.createElement('button');
    b.textContent=label;
    b.className=cls||'';
    b.dataset.kb='1';
    b.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); onClick(); });
    b.addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); onClick(); }, {passive:false});
    kbButtons.push(b);
    kp.appendChild(b);
    return b;
  };
  if(currentLang==='kr'){
    const rows=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']];
    rows.forEach(r=>{r.forEach(k=>{createKbBtn(k,'',()=>typeKey(k));});});
    createKbBtn('스페이스','space',()=>typeKey(' '));
    createKbBtn('⌫','del',()=>delKey());
    createKbBtn('검색','search',()=>doSearch());
  } else {
    const rows=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];
    rows.forEach(r=>{r.forEach(k=>{createKbBtn(k,'',()=>typeKey(k));});});
    createKbBtn('Space','space',()=>typeKey(' '));
    createKbBtn('⌫','del',()=>delKey());
    createKbBtn('Search','search',()=>doSearch());
  }
}

function rebuildFocusable(){
  allFocusable=[];
  const q=document.getElementById('q');
  const kbBtn=document.getElementById('kbBtn');
  const searchBtn=document.getElementById('searchBtn');
  const cards=Array.from(document.querySelectorAll('.card-btn'));
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  const tabKr=document.getElementById('tabKr');
  const tabEn=document.getElementById('tabEn');
  const btnClear=document.getElementById('btnClear');
  const btnHide=document.getElementById('btnHide');
  allFocusable.push(q, kbBtn, searchBtn);
  cards.forEach(c=>allFocusable.push(c));
  allFocusable.push(prevBtn, nextBtn);
  const kbWrap=document.getElementById('keypadWrap');
  if(!kbWrap.classList.contains('hidden')){
    allFocusable.push(tabKr, tabEn, btnClear, btnHide);
    kbButtons.forEach(b=>allFocusable.push(b));
  }
  if(focusIndex>=allFocusable.length) focusIndex=allFocusable.length-1;
  if(focusIndex<0) focusIndex=0;
}

function updateFocusVisual(){
  allFocusable.forEach((el,i)=>{
    if(i===focusIndex){
      el.classList.add('focused');
      el.scrollIntoView({block:'nearest', behavior:'smooth'});
      if(el.dataset.kb==='1'){ inKeyboardMode=true; kbFocusedIndex=kbButtons.indexOf(el); } else { inKeyboardMode=false; }
    } else { el.classList.remove('focused'); }
  });
  kbButtons.forEach((b,i)=>{ if(i===kbFocusedIndex && inKeyboardMode) b.classList.add('focused'); else b.classList.remove('focused'); });
}

function focusTo(index){
  if(index<0) index=0;
  if(index>=allFocusable.length) index=allFocusable.length-1;
  focusIndex=index;
  updateFocusVisual();
}

function focusToKb(kbIdx){
  if(kbIdx<0) kbIdx=0;
  if(kbIdx>=kbButtons.length) kbIdx=kbButtons.length-1;
  kbFocusedIndex=kbIdx;
  const globalIdx=allFocusable.indexOf(kbButtons[kbIdx]);
  if(globalIdx>=0) focusIndex=globalIdx;
  inKeyboardMode=true;
  updateFocusVisual();
}

function moveFocus(dir){
  const kbWrap=document.getElementById('keypadWrap');
  const kbVisible=!kbWrap.classList.contains('hidden');
  if(inKeyboardMode && kbVisible){
    const cols=10;
    let newKbIdx=kbFocusedIndex;
    if(dir==='right') newKbIdx=Math.min(kbButtons.length-1, kbFocusedIndex+1);
    else if(dir==='left') newKbIdx=Math.max(0, kbFocusedIndex-1);
    else if(dir==='down') newKbIdx=Math.min(kbButtons.length-1, kbFocusedIndex+cols);
    else if(dir==='up'){
      newKbIdx=kbFocusedIndex-cols;
      if(newKbIdx<0){
        focusIndex=allFocusable.indexOf(document.getElementById('tabKr'));
        inKeyboardMode=false;
        updateFocusVisual();
        return;
      }
    }
    if(newKbIdx!==kbFocusedIndex){ focusToKb(newKbIdx); }
    return;
  }
  if(dir==='down' || dir==='right') focusTo(focusIndex+1);
  else if(dir==='up' || dir==='left') focusTo(focusIndex-1);
}

// V31: 누르면 나오게 - 처음엔 숨김
function showKeypad(){
  console.log('SHOW KEYPAD - V31');
  const wrap=document.getElementById('keypadWrap');
  wrap.classList.remove('hidden');
  wrap.style.display='flex';
  document.getElementById('kbBtn').textContent='⌨️ 닫기';
  document.getElementById('kbBtn').classList.add('active');
  rebuildFocusable();
  setTimeout(()=>{ focusToKb(0); },150);
  document.getElementById('statusText').textContent='V31: 커스텀 키보드 뜸 - 밴드로 이동 후 핀치 입력';
}

function hideKeypad(){
  console.log('HIDE KEYPAD - V31');
  const wrap=document.getElementById('keypadWrap');
  wrap.classList.add('hidden');
  wrap.style.display='none';
  document.getElementById('kbBtn').textContent='⌨️ 키보드';
  document.getElementById('kbBtn').classList.remove('active');
  inKeyboardMode=false;
  rebuildFocusable();
  focusTo(1);
  document.getElementById('statusText').textContent='V31: 키보드 숨김 - ⌨️ 누르면 다시 나옴';
}

function toggleKeypad(){
  console.log('TOGGLE KEYPAD - V31');
  const wrap=document.getElementById('keypadWrap');
  const isHidden=wrap.classList.contains('hidden');
  if(isHidden){ showKeypad(); }
  else { hideKeypad(); }
}

let lastItems=[], currentPage=0, isPlayer=false;
const ITEMS_PER_PAGE=10;
async function fetchTimeout(url,ms=7000){const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); try{const r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) throw new Error(r.status); return await r.json();}catch(e){clearTimeout(t); throw e;}}
async function searchPiped(q){
  const INSTANCES=["https://pipedapi.kavin.rocks","https://api.piped.private.coffee"];
  for(let i=0;i<INSTANCES.length;i++){
    document.getElementById('info').textContent=`${i+1}/${INSTANCES.length}`;
    try{const d=await fetchTimeout(`${INSTANCES[i]}/search?q=${encodeURIComponent(q)}&filter=videos`,8000); if(d.items&&d.items.length) return {items:d.items, host:new URL(INSTANCES[i]).host};}catch(e){continue;}
  }
  throw new Error('all failed');
}
function renderPage(){
  const list=document.getElementById('list'); list.innerHTML=''; document.getElementById('player').style.display='none'; document.getElementById('pagination').style.display='flex'; list.style.display='flex'; isPlayer=false; document.getElementById('hud').classList.remove('playing');
  const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); const start=currentPage*ITEMS_PER_PAGE; const end=Math.min(start+ITEMS_PER_PAGE,lastItems.length);
  for(let idx=start; idx<end; idx++){
    const v=lastItems[idx]; const id=v.url?.replace('/watch?v=','')||v.id||''; const title=v.title||'No title'; const ch=v.uploaderName||v.author||''; const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
    const btn=document.createElement('button'); btn.className='card-btn'; btn.id='card-'+idx;
    btn.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" loading="lazy"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
    btn.addEventListener('click', ()=>{ playVideo(id); });
    list.appendChild(btn);
  }
  document.getElementById('pageInfo').textContent=`${currentPage+1}/${totalPages}`; document.getElementById('count').textContent=`${lastItems.length}개`;
  setTimeout(()=>{ rebuildFocusable(); focusTo(3); },100);
}
function changePage(dir){const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); let np=currentPage+dir; if(np<0) np=0; if(np>=totalPages) np=totalPages-1; if(np===currentPage) return; currentPage=np; renderPage();}
function playVideo(id){
  const list=document.getElementById('list'); list.style.display='none';
  document.getElementById('pagination').style.display='none';
  const wrap=document.getElementById('keypadWrap');
  wrap.classList.add('hidden');
  wrap.style.display='none';
  const player=document.getElementById('player');
  player.style.display='flex';
  player.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&fs=1&rel=0&controls=1" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  isPlayer=true;
  document.getElementById('hud').classList.add('playing');
}
function backToList(){document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex'; document.getElementById('pagination').style.display='flex'; isPlayer=false; document.getElementById('hud').classList.remove('playing'); renderPage();}

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown' || e.key==='ArrowUp' || e.key==='ArrowLeft' || e.key==='ArrowRight'){
    e.preventDefault();
    if(e.key==='ArrowDown') moveFocus('down');
    else if(e.key==='ArrowUp') moveFocus('up');
    else if(e.key==='ArrowRight') moveFocus('right');
    else if(e.key==='ArrowLeft') moveFocus('left');
    return;
  }
  if(e.key==='Enter' || e.key===' '){
    e.preventDefault();
    const el=allFocusable[focusIndex];
    if(el){ el.click(); }
    return;
  }
  if(e.key==='Escape'){
    if(isPlayer){ backToList(); return; }
    const wrap=document.getElementById('keypadWrap');
    if(!wrap.classList.contains('hidden')){ hideKeypad(); return; }
  }
});

document.getElementById('kbBtn').addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); toggleKeypad(); });
document.getElementById('kbBtn').addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); toggleKeypad(); }, {passive:false});
document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('prevBtn').addEventListener('click', ()=>changePage(-1));
document.getElementById('nextBtn').addEventListener('click', ()=>changePage(1));
document.getElementById('tabKr').addEventListener('click', ()=>setLang('kr'));
document.getElementById('tabEn').addEventListener('click', ()=>setLang('en'));
document.getElementById('btnClear').addEventListener('click', clearInput);
document.getElementById('btnHide').addEventListener('click', hideKeypad);
document.getElementById('q').addEventListener('click', ()=>{ focusIndex=0; updateFocusVisual(); });

async function doSearch(){
  commitComposing();
  const q=document.getElementById('q').value.trim()||'고양이';
  hideKeypad();
  document.getElementById('list').innerHTML='<div class="center"><b>검색 중...</b><br>'+q+'</div>';
  document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex';
  try{
    const res=await searchPiped(q);
    lastItems=res.items.slice(0,20);
    currentPage=0;
    document.getElementById('info').textContent=res.host+' ✓';
    renderPage();
  }catch(e){
    document.getElementById('list').innerHTML=`<div class="center"><b>실패</b><br><button tabindex="0" onclick="doSearch()" style="background:#00ff88;color:#000;border:0;padding:10px 20px;border-radius:10px;font-weight:900">재시도</button></div>`;
    rebuildFocusable();
  }
}
buildKeypad();
setTimeout(()=>{
  rebuildFocusable();
  // V31: 처음엔 키보드 숨김 - 누르면 나와야지
  hideKeypad();
  setTimeout(()=>{
    committed='고양이'; updateInputField();
    doSearch();
  },300);
},300);
</script>
