<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ray-Ban Swipe Select</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:2px solid #222}
.header{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.logo{font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;background:#00ff88;color:#000;padding:2px 6px;border-radius:4px;font-weight:800}
.search-row{display:flex;gap:6px;padding:8px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#0a0a0a;border:1px solid #444;border-radius:12px;padding:14px 12px;color:#fff;font-size:20px;outline:none}
.search-row button{background:#fff;color:#000;border:0;border-radius:12px;padding:0 14px;font-weight:900;font-size:15px;min-width:60px}
.search-row button.kb{background:#1e1e1e;color:#00ff88;border:1px solid #333;min-width:48px;font-size:20px}
.status{height:24px;padding:0 12px;font-size:11px;color:#00ff88;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative;background:#121212}
.list{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.list::-webkit-scrollbar{display:none}
.card{display:flex;gap:10px;background:#1e1e1e;border-radius:14px;padding:10px;cursor:pointer;border:2px solid transparent;min-height:92px;align-items:center;transition:all .15s ease;position:relative}
.card:active{transform:scale(0.97)}
.card.focused{border-color:#00ff88;background:#2a2a2a;box-shadow:0 0 0 2px rgba(0,255,136,.2), 0 4px 12px rgba(0,0,0,.5);transform:scale(1.02);z-index:2}
.card.selected{border-color:#00ff88;background:#242424}
.thumb{width:130px;height:74px;border-radius:10px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:11px;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{background:#2a2a2a;color:#00ff88;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
.hint{position:absolute;bottom:8px;right:8px;font-size:9px;color:#00ff88;background:rgba(0,255,136,.15);padding:2px 6px;border-radius:10px;opacity:0;transition:opacity .2s}
.card.focused .hint{opacity:1}
.player{flex:1;display:flex;flex-direction:column;background:#000}
.player iframe{flex:1;width:100%;border:0}
.controls{display:flex;gap:6px;padding:8px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.ctrl{flex:1;background:#2a2a2a;border:0;color:#fff;padding:14px 4px;border-radius:12px;font-size:13px;font-weight:800}
.ctrl.big{flex:1.3;background:#fff;color:#000;font-size:15px}
.keypad-wrap{display:none;flex-direction:column;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0}
.keypad-tabs{display:flex;gap:4px;padding:6px 6px 0 6px}
.keypad-tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#888;font-size:12px;font-weight:800}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad{display:grid;gap:3px;padding:6px}
.keypad.kr{grid-template-columns:repeat(10,1fr)}
.keypad.en{grid-template-columns:repeat(10,1fr)}
.keypad button{background:#1e1e1e;border:0;color:#fff;padding:12px 2px;border-radius:8px;font-size:15px;font-weight:700;min-height:44px}
.keypad button:active{background:#00ff88;color:#000}
.keypad .space{grid-column:span 4;background:#2a2a2a}
.keypad .del{grid-column:span 2;background:#ff3b30;color:#fff}
.keypad .enter{grid-column:span 2;background:#00ff88;color:#000}
.footer{height:18px;padding:0 10px;background:#000;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#555;flex-shrink:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#777;padding:20px;text-align:center}
.center b{color:#fff;font-size:16px}
.swipe-indicator{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:3px;height:60px;background:rgba(255,255,255,.1);border-radius:3px;pointer-events:none}
.swipe-indicator .bar{width:100%;background:#00ff88;border-radius:3px;transition:all .2s}
</style>
</head>
<body>
<div class="hud">
  <div class="header">
    <div class="logo"><span style="width:26px;height:26px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px">RB</span> YouTube <span class="badge">SWIPE</span></div>
    <div style="font-size:10px;color:#888">스와이프로 선택</div>
  </div>
  <div class="search-row">
    <input id="q" placeholder="터치 → 키보드 → 검색" value="" onfocus="showKeypad()" onclick="showKeypad()">
    <button class="kb" onclick="toggleKeypad()">⌨️</button>
    <button onclick="doSearch()">검색</button>
  </div>
  <div id="status" class="status"><span id="statusText">화면을 위아래로 쓸어 넘겨 선택 • 탭해서 재생</span><span id="info" style="color:#666">ready</span></div>
  <div class="content">
    <div id="list" class="list"></div>
    <div id="player" class="player" style="display:none"></div>
    <div class="swipe-indicator"><div id="scrollBar" class="bar" style="height:20%;margin-top:0%"></div></div>
  </div>
  <div id="keypadWrap" class="keypad-wrap">
    <div class="keypad-tabs">
      <button id="tabKr" class="active" onclick="setLang('kr')">한글</button>
      <button id="tabEn" onclick="setLang('en')">ENG</button>
      <button onclick="clearInput()">지우기</button>
      <button onclick="delKey()" style="background:#ff3b30;color:#fff">⌫</button>
      <button onclick="hideKeypad()" style="background:#333;color:#fff">▼ 닫기</button>
    </div>
    <div id="keypad" class="keypad kr"></div>
  </div>
  <div class="footer"><span>SWIPE • NO BUTTONS • 화면 스와이프로 이동</span><span>KR</span></div>
</div>

<script>
const INSTANCES = [
  "https://pipedapi.kavin.rocks",
  "https://api.piped.private.coffee",
  "https://pipedapi.adminforge.de",
  "https://pipedapi.in.projectsegfau.lt",
  "https://pipedapi.syncpundi.com",
  "https://pipedapi.drgns.space",
  "https://pipedapi.leptosinfra.com",
  "https://api.piped.privacydev.net"
];

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const DOUBLE_JONG_SPLIT = {'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
const DOUBLE_JONG_COMBINE = {'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const DOUBLE_JUNG_COMBINE = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const DOUBLE_CHO_COMBINE = {'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'};
function isConsonant(j){return CHO.includes(j);} function isVowel(j){return ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'].includes(j);}
let committed=''; let composing={cho:-1,jung:-1,jong:0};
function choIdx(c){return CHO.indexOf(c);} function jungIdx(j){return JUNG.indexOf(j);} function jongIdx(j){return JONG.indexOf(j);}
function makeSyllable(cho,jung,jong){if(cho<0||jung<0) return null; return String.fromCharCode(0xAC00+cho*21*28+jung*28+jong);}
function getComposingChar(){if(composing.cho>=0&&composing.jung>=0){return makeSyllable(composing.cho,composing.jung,composing.jong);} if(composing.cho>=0&&composing.jung<0){return CHO[composing.cho];} if(composing.cho<0&&composing.jung>=0){return JUNG[composing.jung];} return '';}
function commitComposing(){const ch=getComposingChar(); if(ch) committed+=ch; composing={cho:-1,jung:-1,jong:0};}
function updateInputField(){document.getElementById('q').value=committed+getComposingChar();}
function inputHangulClean(jamo){
  if(jamo===' '){commitComposing(); committed+=' '; updateInputField(); return;}
  if(isConsonant(jamo)){
    const cIdx=choIdx(jamo);
    if(composing.cho<0&&composing.jung<0){composing.cho=cIdx;}
    else if(composing.cho>=0&&composing.jung<0){const prev=CHO[composing.cho]; const comb=DOUBLE_CHO_COMBINE[prev+jamo]; if(comb){composing.cho=choIdx(comb);} else {committed+=CHO[composing.cho]; composing.cho=cIdx;}}
    else if(composing.jung>=0&&composing.jong==0){const ji=jongIdx(jamo); if(ji>0){composing.jong=ji;} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
    else if(composing.jong>0){const prevJ=JONG[composing.jong]; const comb=DOUBLE_JONG_COMBINE[prevJ+jamo]; if(comb){composing.jong=jongIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,composing.jong); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
  } else {
    const vIdx=jungIdx(jamo);
    if(composing.cho<0){composing.cho=choIdx('ㅇ'); composing.jung=vIdx;}
    else if(composing.jung<0){composing.jung=vIdx;}
    else if(composing.jong==0){const prevV=JUNG[composing.jung]; const comb=DOUBLE_JUNG_COMBINE[prevV+jamo]; if(comb){composing.jung=jungIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:choIdx('ㅇ'),jung:vIdx,jong:0};}}
    else {const jongChar=JONG[composing.jong]; let remainingJong=0; let nextChoChar=jongChar; if(DOUBLE_JONG_SPLIT[jongChar]){const parts=DOUBLE_JONG_SPLIT[jongChar]; remainingJong=jongIdx(parts[0]); nextChoChar=parts[1];} else {remainingJong=0; nextChoChar=jongChar;} const syl=makeSyllable(composing.cho,composing.jung,remainingJong); committed+=syl; composing={cho:choIdx(nextChoChar),jung:vIdx,jong:0};}
  }
  updateInputField();
}
function delKey(){
  if(getComposingChar()){
    if(composing.jong>0){const jc=JONG[composing.jong]; if(DOUBLE_JONG_SPLIT[jc]){const first=DOUBLE_JONG_SPLIT[jc][0]; composing.jong=jongIdx(first);} else {composing.jong=0;}}
    else if(composing.jung>=0){const jChar=JUNG[composing.jung]; let found=false; for(const [k,v] of Object.entries(DOUBLE_JUNG_COMBINE)){if(v===jChar){composing.jung=jungIdx(k[0]); found=true; break;}} if(!found) composing.jung=-1;}
    else if(composing.cho>=0){const cChar=CHO[composing.cho]; let found=false; for(const [k,v] of Object.entries(DOUBLE_CHO_COMBINE)){if(v===cChar){composing.cho=choIdx(k[0]); found=true; break;}} if(!found) composing.cho=-1;}
  } else {if(committed.length>0) committed=committed.slice(0,-1);}
  updateInputField();
}
function clearInput(){committed=''; composing={cho:-1,jung:-1,jong:0}; updateInputField();}
function typeKey(k){if(currentLang==='kr'){if(k===' ') inputHangulClean(' '); else inputHangulClean(k);} else {commitComposing(); committed+=k; updateInputField();}}

let currentLang='kr';
function setLang(lang){currentLang=lang; document.getElementById('tabKr').classList.toggle('active',lang==='kr'); document.getElementById('tabEn').classList.toggle('active',lang==='en'); buildKeypad();}
function buildKeypad(){
  const kp=document.getElementById('keypad'); kp.innerHTML=''; kp.className='keypad '+currentLang;
  if(currentLang==='kr'){
    const rows=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ','DEL',' ']];
    rows.forEach(row=>{row.forEach(k=>{const b=document.createElement('button'); if(k===' '){b.textContent='스페이스'; b.className='space'; b.style.gridColumn='span 3'; b.onclick=()=>typeKey(' ');} else if(k==='DEL'){b.textContent='⌫'; b.className='del'; b.onclick=()=>delKey();} else {b.textContent=k; b.onclick=()=>typeKey(k);} kp.appendChild(b);});});
    const enter=document.createElement('button'); enter.textContent='검색'; enter.className='enter'; enter.style.gridColumn='span 2'; enter.onclick=()=>doSearch(); kp.appendChild(enter);
  } else {
    const rows=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m','DEL',' ']];
    rows.forEach(row=>{row.forEach(k=>{const b=document.createElement('button'); if(k===' '){b.textContent='Space'; b.className='space'; b.style.gridColumn='span 3'; b.onclick=()=>typeKey(' ');} else if(k==='DEL'){b.textContent='⌫'; b.className='del'; b.onclick=()=>delKey();} else {b.textContent=k; b.onclick=()=>typeKey(k);} kp.appendChild(b);});});
    const enter=document.createElement('button'); enter.textContent='Search'; enter.className='enter'; enter.style.gridColumn='span 2'; enter.onclick=()=>doSearch(); kp.appendChild(enter);
  }
}
function showKeypad(){document.getElementById('keypadWrap').style.display='flex'; document.getElementById('statusText').textContent='입력 중... 검색 누르면 키보드 사라짐';}
function hideKeypad(){document.getElementById('keypadWrap').style.display='none'; document.getElementById('statusText').textContent='화면 스와이프로 위아래 이동 • 탭해서 재생';}
function toggleKeypad(){const w=document.getElementById('keypadWrap'); if(w.style.display==='none'||w.style.display===''){showKeypad();} else {hideKeypad();}}

let lastItems=[], focusedIndex=-1, isPlayer=false;
async function fetchTimeout(url,ms=6500){const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); try{const r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) throw new Error(r.status); return await r.json();}catch(e){clearTimeout(t); throw e;}}
async function searchPiped(q){for(let i=0;i<INSTANCES.length;i++){document.getElementById('info').textContent=`${i+1}/${INSTANCES.length}`; try{const d=await fetchTimeout(`${INSTANCES[i]}/search?q=${encodeURIComponent(q)}&filter=videos`,7000); if(d.items&&d.items.length) return {items:d.items, host:new URL(INSTANCES[i]).host};}catch(e){continue;}} throw new Error('all failed');}

function renderList(items){
  const list=document.getElementById('list'); list.innerHTML=''; document.getElementById('player').style.display='none'; list.style.display='flex'; isPlayer=false; focusedIndex=-1;
  items.forEach((v,idx)=>{const id=v.url?.replace('/watch?v=','')||v.id||''; const title=v.title||'No title'; const ch=v.uploaderName||v.author||''; const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`; const div=document.createElement('div'); div.className='card'; div.id='card-'+idx; div.dataset.idx=idx; div.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" onerror="this.src='https://i.ytimg.com/vi/${id}/mqdefault.jpg'"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div><div class="hint">탭 ▶</div>`; div.onclick=()=>playVideo(id,title,idx); list.appendChild(div);});
  // Auto focus first after render
  setTimeout(()=>focusCard(0),100);
}

function focusCard(idx){
  if(idx<0||idx>=lastItems.length) return;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('focused'));
  const el=document.getElementById('card-'+idx);
  if(el){el.classList.add('focused'); el.scrollIntoView({behavior:'smooth',block:'center'}); focusedIndex=idx; document.getElementById('statusText').textContent=`${idx+1}/${lastItems.length} - 스와이프로 이동 • 탭해서 재생`;}
  updateScrollBar();
}

function playVideo(id,title,idx){
  const list=document.getElementById('list'); list.style.display='none'; hideKeypad(); const player=document.getElementById('player'); player.style.display='flex'; isPlayer=true;
  player.innerHTML=`<div class="controls"><button class="ctrl" onclick="backToList()">← 목록</button><button class="ctrl big" onclick="toggleFullscreen()">⛶ 크게</button><button class="ctrl" onclick="nextVideo(1)">다음 →</button></div><iframe id="yt" src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&enablejsapi=1&origin=https://k9h9s9999-coder.github.io" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe><div class="controls"><button class="ctrl" onclick="nextVideo(-1)">← 이전</button><button class="ctrl big" onclick="backToList()">✕ 닫기</button><button class="ctrl" onclick="copyLink('${id}')">복사</button></div>`;
  document.getElementById('statusText').textContent=`${idx+1}/${lastItems.length} - ${title.slice(0,28)}`;
}
function backToList(){document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex'; isPlayer=false; if(focusedIndex>=0) setTimeout(()=>focusCard(focusedIndex),100);}
function nextVideo(dir){if(!lastItems.length) return; let ni=focusedIndex+dir; if(ni<0) ni=lastItems.length-1; if(ni>=lastItems.length) ni=0; const v=lastItems[ni]; const id=v.url?.replace('/watch?v=','')||v.id; playVideo(id,v.title,ni); focusedIndex=ni;}

function updateScrollBar(){
  const list=document.getElementById('list');
  if(!list) return;
  const scrollTop=list.scrollTop; const scrollHeight=list.scrollHeight - list.clientHeight;
  const pct = scrollHeight>0 ? scrollTop/scrollHeight : 0;
  const bar=document.getElementById('scrollBar');
  if(bar){ bar.style.marginTop=(pct*60)+'%'; }
}

// Touch swipe handling for Ray-Ban temple pad + finger swipe
let touchStartY=0, touchStartTime=0, lastTouchY=0;
const listEl = ()=>document.getElementById('list');
document.addEventListener('touchstart', e=>{
  if(isPlayer) return;
  if(e.target.closest('.keypad-wrap')) return;
  touchStartY=e.touches[0].clientY; lastTouchY=touchStartY; touchStartTime=Date.now();
},{passive:true});

document.addEventListener('touchmove', e=>{
  if(isPlayer) return;
  if(e.target.closest('.keypad-wrap')) return;
  const curY=e.touches[0].clientY;
  const diff=lastTouchY-curY;
  if(Math.abs(diff)>2){
    // native scroll will handle, but we also track for focus change
    const list=listEl();
    if(list) list.scrollTop+=diff*0.8;
  }
  lastTouchY=curY;
},{passive:true});

document.addEventListener('touchend', e=>{
  if(isPlayer) return;
  if(e.target.closest('.keypad-wrap') || e.target.closest('.card')) return;
  const endY=e.changedTouches[0].clientY;
  const diffY=touchStartY-endY;
  const duration=Date.now()-touchStartTime;
  // Quick flick = move focus
  if(Math.abs(diffY)>60 && duration<400){
    if(diffY>0){ // swipe up -> next
      focusCard(Math.min(focusedIndex+1, lastItems.length-1));
    } else { // swipe down -> prev
      focusCard(Math.max(focusedIndex-1, 0));
    }
  }
  updateScrollBar();
},{passive:true});

// Scroll listener for scrollbar
document.getElementById('list').addEventListener('scroll', updateScrollBar, {passive:true});

// Click on focused card plays, swipe changes focus - also allow tapping anywhere to play focused
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown') focusCard(Math.min(focusedIndex+1, lastItems.length-1));
  if(e.key==='ArrowUp') focusCard(Math.max(focusedIndex-1, 0));
  if(e.key==='Enter' && focusedIndex>=0){ const v=lastItems[focusedIndex]; const id=v.url?.replace('/watch?v=','')||v.id; playVideo(id,v.title,focusedIndex); }
});

function copyLink(id){navigator.clipboard.writeText('https://youtu.be/'+id); document.getElementById('statusText').textContent='링크 복사됨!';}
function toggleFullscreen(){const f=document.getElementById('yt'); if(f) f.requestFullscreen?.();}

async function doSearch(){
  commitComposing();
  const q=document.getElementById('q').value.trim()||'고양이';
  hideKeypad();
  document.getElementById('statusText').textContent='검색 중...';
  document.getElementById('list').innerHTML='<div class="center"><b>검색 중...</b>서버 순회</div>';
  document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex';
  try{
    const res=await searchPiped(q);
    lastItems=res.items.slice(0,20);
    document.getElementById('statusText').textContent=`${q} - ${lastItems.length}개 - 스와이프로 선택`;
    document.getElementById('info').textContent=res.host+' ✓';
    renderList(lastItems);
  }catch(e){
    document.getElementById('statusText').textContent='Piped 실패 - 직접 검색 전환';
    const p=document.getElementById('player'); p.style.display='flex'; document.getElementById('list').style.display='none';
    p.innerHTML=`<div class="controls"><button class="ctrl" onclick="backToList()">← 목록</button><button class="ctrl big" onclick="doSearch()">재시도</button></div><iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}" allow="encrypted-media; fullscreen"></iframe>`;
  }
}

buildKeypad(); hideKeypad();
setTimeout(()=>{ document.getElementById('q').value='고양이'; doSearch(); }, 600);
</script>
</body>
</html>
