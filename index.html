<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>V25 Keyboard Only Fix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;width:600px;height:600px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.hud{width:600px;height:600px;background:#121212;display:flex;flex-direction:column;position:relative;border-radius:18px;overflow:hidden;border:3px solid #00ff88}
.hud.playing{border-radius:0;border:0;background:#000}
.hud.playing .header, .hud.playing .search-row, .hud.playing .status, .hud.playing .footer, .hud.playing .pagination, .hud.playing .keypad-wrap{display:none !important}
.hud.playing .content{flex:1;height:600px;background:#000}
.hud.playing .player{height:600px;width:600px;background:#000;display:flex !important}
.hud.playing .player iframe{height:600px !important;width:600px !important;border:0}
.header{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0;font-size:12px}
.search-row{display:flex;gap:4px;padding:6px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.search-row input{flex:1;background:#000;border:2px solid #00ff88;border-radius:10px;padding:12px 10px;color:#fff;font-size:16px;outline:none;min-width:0}
.search-row input:focus{box-shadow:0 0 0 3px rgba(0,255,136,.4)}
.search-row button{background:#00ff88;color:#000;border:0;border-radius:10px;padding:0 12px;font-weight:900;font-size:13px;min-width:56px;height:44px;outline:none;flex-shrink:0}
.search-row button:focus{transform:scale(1.05);box-shadow:0 0 0 3px rgba(0,255,136,.5)}
.search-row button.kb{background:#1e1e1e;color:#00ff88;border:1px solid #00ff88;min-width:64px}
.search-row button.kb.active{background:#00ff88;color:#000}
.status{height:16px;padding:0 10px;font-size:9px;color:#555;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-shrink:0}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#121212}
.list{flex:1;overflow:hidden;padding:4px 6px;display:flex;flex-direction:column;gap:4px}
.card-btn{display:flex;gap:6px;align-items:center;background:#1e1e1e;border:2px solid transparent;border-radius:10px;padding:6px;width:100%;text-align:left;min-height:56px;outline:none;color:#fff}
.card-btn:focus{border-color:#00ff88;background:#2a2a2a;box-shadow:0 0 0 3px rgba(0,255,136,.3)}
.thumb{width:86px;height:48px;border-radius:6px;background:#000;object-fit:cover;flex-shrink:0}
.meta{flex:1;min-width:0}
.title{font-size:11px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-size:8px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{background:#2a2a2a;color:#00ff88;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;flex-shrink:0}
.player{flex:1;display:none;flex-direction:column;background:#000;position:relative}
.player iframe{flex:1;width:100%;border:0;background:#000}
.pagination{height:34px;display:flex;gap:6px;padding:4px 6px;background:#0a0a0a;border-top:1px solid #222;flex-shrink:0}
.page-btn{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:8px;font-size:11px;font-weight:800;outline:none;height:30px}
.page-btn:focus{background:#00ff88;color:#000;border-color:#00ff88}
.footer{height:12px;padding:0 8px;background:#000;display:flex;justify-content:space-between;font-size:7px;color:#444;flex-shrink:0}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#666;padding:20px;text-align:center}
.version{position:absolute;top:2px;right:2px;background:#00ff88;color:#000;font-size:7px;font-weight:900;padding:2px 5px;border-radius:4px;z-index:99}

/* 키보드 - 제대로 눌리게 */
.keypad-wrap{display:flex;flex-direction:column;background:#000;border-top:2px solid #00ff88;flex-shrink:0;height:230px;overflow:hidden}
.keypad-wrap.hidden{display:none !important}
.keypad-tabs{display:flex;gap:4px;padding:6px;background:#111;flex-shrink:0}
.keypad-tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid #333;background:#1e1e1e;color:#888;font-size:11px;font-weight:800;outline:none;min-height:34px}
.keypad-tabs button.active{background:#00ff88;color:#000;border-color:#00ff88}
.keypad-tabs button:focus{box-shadow:0 0 0 2px #00ff88}
.keypad{display:grid;gap:4px;padding:6px;flex:1;overflow-y:auto;align-content:start;background:#000}
.keypad.kr{grid-template-columns:repeat(10,1fr)}
.keypad.en{grid-template-columns:repeat(10,1fr)}
.keypad button{background:#222;border:1px solid #444;color:#fff;padding:0;border-radius:8px;font-size:15px;font-weight:700;min-height:44px;outline:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.keypad button:focus{background:#00ff88 !important;color:#000 !important;border-color:#00ff88 !important;transform:scale(1.08);box-shadow:0 0 0 3px rgba(0,255,136,.6);z-index:10}
.keypad button:active{background:#00ff88;color:#000}
.keypad button.del{background:#331111;color:#ff5555;border-color:#ff3333}
.keypad button.search{background:#00ff88;color:#000;border-color:#00ff88;font-weight:900;font-size:13px}
.keypad button.space{background:#111;color:#00ff88;border-color:#00ff88;grid-column:span 4}
.play-overlay{display:none;position:absolute;top:0;left:0;width:600px;height:600px;z-index:100}
.hud.playing .play-overlay{display:flex;flex-direction:column;justify-content:space-between;pointer-events:auto}
.play-top,.play-bottom{display:flex;justify-content:space-between;padding:10px;background:transparent;opacity:0;transition:opacity .3s}
.play-overlay.show .play-top,.play-overlay.show .play-bottom{opacity:1}
.play-btn{background:rgba(0,0,0,.7);color:#fff;border:1px solid #fff;border-radius:20px;padding:8px 14px;font-size:11px;font-weight:800;outline:none}
.play-btn:focus{background:#00ff88;color:#000;border-color:#00ff88}
</style>
</head>
<body>
<div class="hud" id="hud">
<div class="version">V25 키보드만</div>
<div class="header"><div>RB YouTube</div><div style="font-size:9px;color:#00ff88" id="pageInfo"></div></div>
<div class="search-row">
<input id="q" type="text" readonly tabindex="0" placeholder="키보드에서 입력">
<button id="kbBtn" class="kb active" tabindex="0" onclick="toggleKeypad()">⌨️</button>
<button id="searchBtn" tabindex="0" onclick="doSearch()">검색</button>
</div>
<div class="status"><span id="statusText">키보드 버튼 눌러보세요</span><span id="info"></span></div>
<div class="content" id="content"><div id="list" class="list"></div><div id="player" class="player"></div></div>
<div class="pagination" id="pagination">
<button class="page-btn" id="prevBtn" tabindex="0" onclick="changePage(-1)">◀ 이전</button>
<button class="page-btn" id="nextBtn" tabindex="0" onclick="changePage(1)">다음 ▶</button>
</div>
<div id="keypadWrap" class="keypad-wrap">
<div class="keypad-tabs">
<button id="tabKr" class="active" tabindex="0" onclick="setLang('kr')">한글</button>
<button id="tabEn" tabindex="0" onclick="setLang('en')">ENG</button>
<button tabindex="0" onclick="clearInput()">지우기</button>
<button tabindex="0" onclick="hideKeypad()">닫기</button>
</div>
<div id="keypad" class="keypad kr"></div>
</div>
<div class="footer"><span>V25 키보드 수정</span><span id="count"></span></div>
<div class="play-overlay" id="playOverlay" onclick="toggleOverlay()">
<div class="play-top"><button class="play-btn" tabindex="0" onclick="backToList(); event.stopPropagation();">← 목록</button><button class="play-btn" tabindex="0" onclick="nextVideo(1); event.stopPropagation();">다음 ▶</button></div>
<div class="play-bottom"><button class="play-btn" tabindex="0" onclick="nextVideo(-1); event.stopPropagation();">◀ 이전</button><button class="play-btn" tabindex="0" onclick="backToList(); event.stopPropagation();">닫기</button></div>
</div>
</div>
<script>
console.log('V25 Keyboard Only');
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choIdx(c){return CHO.indexOf(c);} function jungIdx(j){return JUNG.indexOf(j);} function jongIdx(j){return JONG.indexOf(j);}
function makeSyllable(cho,jung,jong){if(cho<0||jung<0) return null; return String.fromCharCode(0xAC00+cho*21*28+jung*28+jong);}
let committed=''; let composing={cho:-1,jung:-1,jong:0};
function getComposingChar(){if(composing.cho>=0&&composing.jung>=0){return makeSyllable(composing.cho,composing.jung,composing.jong);} if(composing.cho>=0&&composing.jung<0){return CHO[composing.cho];} if(composing.cho<0&&composing.jung>=0){return JUNG[composing.jung];} return '';}
function commitComposing(){const ch=getComposingChar(); if(ch) committed+=ch; composing={cho:-1,jung:-1,jong:0};}
function updateInputField(){const d=committed+getComposingChar(); document.getElementById('q').value=d; document.getElementById('statusText').textContent=d?`입력중: ${d}`:'키보드에서 입력하세요';}
function isConsonant(j){return CHO.includes(j);}
function inputHangulClean(jamo){
  if(jamo===' '){commitComposing(); committed+=' '; updateInputField(); return;}
  const DC={'ㄱㄱ':'ㄲ','ㄷㄷ':'ㄸ','ㅂㅂ':'ㅃ','ㅅㅅ':'ㅆ','ㅈㅈ':'ㅉ'}; const DJC={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'}; const DJOC={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'}; const DJS={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
  if(isConsonant(jamo)){
    const cIdx=choIdx(jamo);
    if(composing.cho<0&&composing.jung<0){composing.cho=cIdx;}
    else if(composing.cho>=0&&composing.jung<0){const prev=CHO[composing.cho]; const comb=DC[prev+jamo]; if(comb){composing.cho=choIdx(comb);} else {committed+=CHO[composing.cho]; composing.cho=cIdx;}}
    else if(composing.jung>=0&&composing.jong==0){const ji=jongIdx(jamo); if(ji>0){composing.jong=ji;} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
    else if(composing.jong>0){const prevJ=JONG[composing.jong]; const comb=DJOC[prevJ+jamo]; if(comb){composing.jong=jongIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,composing.jong); committed+=syl; composing={cho:cIdx,jung:-1,jong:0};}}
  } else {
    const vIdx=jungIdx(jamo);
    if(composing.cho<0){composing.cho=choIdx('ㅇ'); composing.jung=vIdx;}
    else if(composing.jung<0){composing.jung=vIdx;}
    else if(composing.jong==0){const prevV=JUNG[composing.jung]; const comb=DJC[prevV+jamo]; if(comb){composing.jung=jungIdx(comb);} else {const syl=makeSyllable(composing.cho,composing.jung,0); committed+=syl; composing={cho:choIdx('ㅇ'),jung:vIdx,jong:0};}}
    else {const jongChar=JONG[composing.jong]; let rem=0; let nextC=jongChar; if(DJS[jongChar]){const p=DJS[jongChar]; rem=jongIdx(p[0]); nextC=p[1];} else {rem=0; nextC=jongChar;} const syl=makeSyllable(composing.cho,composing.jung,rem); committed+=syl; composing={cho:choIdx(nextC),jung:vIdx,jong:0};}
  }
  updateInputField();
}
function delKey(){if(getComposingChar()){if(composing.jong>0){composing.jong=0;} else if(composing.jung>=0){composing.jung=-1;} else if(composing.cho>=0){composing.cho=-1;}} else {if(committed.length>0) committed=committed.slice(0,-1);} updateInputField();}
function clearInput(){committed=''; composing={cho:-1,jung:-1,jong:0}; updateInputField();}
function typeKey(k){
  console.log('KEY PRESSED:',k);
  if(currentLang==='kr'){if(k===' ') inputHangulClean(' '); else inputHangulClean(k);}
  else {commitComposing(); committed+=k; updateInputField();}
  if(navigator.vibrate) navigator.vibrate(20);
}
let currentLang='kr';
function setLang(lang){currentLang=lang; document.getElementById('tabKr').classList.toggle('active',lang==='kr'); document.getElementById('tabEn').classList.toggle('active',lang==='en'); buildKeypad(); setTimeout(()=>{const f=document.querySelector('#keypad button'); if(f) f.focus();},80);}
function buildKeypad(){
  const kp=document.getElementById('keypad'); kp.innerHTML=''; kp.className='keypad '+currentLang;
  const createBtn=(label, cls, onClick)=>{
    const b=document.createElement('button');
    b.textContent=label;
    b.className=cls||'';
    b.setAttribute('tabindex','0');
    b.addEventListener('click', (e)=>{ e.preventDefault(); onClick(); b.focus(); });
    b.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onClick(); } });
    // 터치 대응
    b.addEventListener('touchstart', (e)=>{ e.preventDefault(); onClick(); }, {passive:false});
    return b;
  };
  if(currentLang==='kr'){
    const rows=[['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'],['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'],['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ']];
    rows.forEach(r=>{r.forEach(k=>{kp.appendChild(createBtn(k,'',()=>typeKey(k)));});});
    kp.appendChild(createBtn('스페이스','space',()=>typeKey(' ')));
    kp.appendChild(createBtn('⌫','del',()=>delKey()));
    kp.appendChild(createBtn('검색','search',()=>doSearch()));
  } else {
    const rows=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];
    rows.forEach(r=>{r.forEach(k=>{kp.appendChild(createBtn(k,'',()=>typeKey(k)));});});
    kp.appendChild(createBtn('Space','space',()=>typeKey(' ')));
    kp.appendChild(createBtn('⌫','del',()=>delKey()));
    kp.appendChild(createBtn('Search','search',()=>doSearch()));
  }
}
function showKeypad(){document.getElementById('keypadWrap').classList.remove('hidden'); document.getElementById('kbBtn').classList.add('active'); setTimeout(()=>{const f=document.querySelector('#keypad button'); if(f) f.focus();},100);}
function hideKeypad(){document.getElementById('keypadWrap').classList.add('hidden'); document.getElementById('kbBtn').classList.remove('active'); document.getElementById('searchBtn').focus();}
function toggleKeypad(){const w=document.getElementById('keypadWrap'); if(w.classList.contains('hidden')) showKeypad(); else hideKeypad();}

let lastItems=[], focusedIndex=0, currentPage=0, isPlayer=false;
const ITEMS_PER_PAGE=10;
async function fetchTimeout(url,ms=7000){const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); try{const r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) throw new Error(r.status); return await r.json();}catch(e){clearTimeout(t); throw e;}}
async function searchPiped(q){
  const INSTANCES=["https://pipedapi.kavin.rocks","https://api.piped.private.coffee"];
  for(let i=0;i<INSTANCES.length;i++){
    document.getElementById('info').textContent=`${i+1}/${INSTANCES.length}`;
    try{const d=await fetchTimeout(`${INSTANCES[i]}/search?q=${encodeURIComponent(q)}&filter=videos`,8000); if(d.items&&d.items.length) return {items:d.items, host:new URL(INSTANCES[i]).host};}catch(e){continue;}
  }
  throw new Error('all failed');
}
function renderPage(){
  const list=document.getElementById('list'); list.innerHTML=''; document.getElementById('player').style.display='none'; document.getElementById('pagination').style.display='flex'; list.style.display='flex'; isPlayer=false; document.getElementById('hud').classList.remove('playing'); document.getElementById('playOverlay').classList.remove('show');
  const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); const start=currentPage*ITEMS_PER_PAGE; const end=Math.min(start+ITEMS_PER_PAGE,lastItems.length);
  for(let idx=start; idx<end; idx++){
    const v=lastItems[idx]; const id=v.url?.replace('/watch?v=','')||v.id||''; const title=v.title||'No title'; const ch=v.uploaderName||v.author||''; const thumb=v.thumbnail||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
    const btn=document.createElement('button'); btn.className='card-btn'; btn.id='card-'+idx; btn.setAttribute('tabindex','0');
    btn.innerHTML=`<div class="num">${idx+1}</div><img class="thumb" src="${thumb}" loading="lazy"><div class="meta"><div class="title">${title}</div><div class="ch">${ch}</div></div>`;
    btn.addEventListener('click', ()=>{ focusedIndex=idx; playVideo(id); });
    list.appendChild(btn);
  }
  document.getElementById('pageInfo').textContent=`${currentPage+1}/${totalPages}`; document.getElementById('count').textContent=`${lastItems.length}개`;
  document.getElementById('prevBtn').disabled=currentPage===0; document.getElementById('nextBtn').disabled=currentPage>=totalPages-1;
  setTimeout(()=>{ const f=document.getElementById('card-'+start); if(f) f.focus(); },100);
}
function changePage(dir){const totalPages=Math.ceil(lastItems.length/ITEMS_PER_PAGE); let np=currentPage+dir; if(np<0) np=0; if(np>=totalPages) np=totalPages-1; if(np===currentPage) return; currentPage=np; focusedIndex=currentPage*ITEMS_PER_PAGE; renderPage();}
function playVideo(id){
  const list=document.getElementById('list'); list.style.display='none';
  document.getElementById('pagination').style.display='none';
  hideKeypad();
  const player=document.getElementById('player');
  player.style.display='flex';
  // V12처럼 유튜브만 - 글자 하나도 없이
  player.innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&fs=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  isPlayer=true;
  document.getElementById('hud').classList.add('playing');
}
function backToList(){document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex'; document.getElementById('pagination').style.display='flex'; isPlayer=false; document.getElementById('hud').classList.remove('playing'); renderPage();}
function nextVideo(dir){if(!lastItems.length) return; let ni=focusedIndex+dir; if(ni<0) ni=lastItems.length-1; if(ni>=lastItems.length) ni=0; focusedIndex=ni; currentPage=Math.floor(ni/ITEMS_PER_PAGE); const v=lastItems[ni]; const id=v.url?.replace('/watch?v=','')||v.id; playVideo(id);}
function toggleOverlay(){const o=document.getElementById('playOverlay'); o.classList.toggle('show'); if(o.classList.contains('show')) setTimeout(()=>o.classList.remove('show'),3500);}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(isPlayer){ backToList(); return; } if(!document.getElementById('keypadWrap').classList.contains('hidden')){ hideKeypad(); return; } } if(isPlayer && e.key==='ArrowRight'){ nextVideo(1); e.preventDefault(); } if(isPlayer && e.key==='ArrowLeft'){ nextVideo(-1); e.preventDefault(); } });
async function doSearch(){
  commitComposing();
  const q=document.getElementById('q').value.trim()||'고양이';
  hideKeypad();
  document.getElementById('list').innerHTML='<div class="center"><b>검색 중...</b><br>'+q+'</div>';
  document.getElementById('player').style.display='none'; document.getElementById('list').style.display='flex';
  try{
    const res=await searchPiped(q);
    lastItems=res.items.slice(0,20);
    focusedIndex=0; currentPage=0;
    document.getElementById('info').textContent=res.host+' ✓';
    renderPage();
  }catch(e){
    document.getElementById('list').innerHTML=`<div class="center"><b>실패</b><br><button tabindex="0" onclick="doSearch()" style="background:#00ff88;color:#000;border:0;padding:10px 20px;border-radius:10px;font-weight:900">재시도</button></div>`;
  }
}
buildKeypad(); showKeypad();
setTimeout(()=>{ committed='고양이'; updateInputField(); doSearch(); }, 500);
</script>
</body>
</html>
